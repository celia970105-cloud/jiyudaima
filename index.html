<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️极禹刷啵⭐️</title>
    <style>
        :root {
            --primary-pink: #FF799C;
            --light-pink: #FFCCDD;
            --soft-white: rgba(255, 255, 255, 0.95);
            --text-dark: #555555;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, "Microsoft JhengHei", sans-serif;
            background-color: var(--light-pink);
            background-image: linear-gradient(135deg, #FFCCDD 0%, #FFB3D1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ✨ 星光背景閃爍 */
        body::before {
            content: '★';
            position: fixed;
            top: 8%;
            left: 12%;
            color: white;
            font-size: 24px;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        body::after {
            content: '✧';
            position: fixed;
            bottom: 12%;
            right: 10%;
            color: white;
            font-size: 32px;
            opacity: 0.4;
            animation: twinkle 4s infinite ease-in-out reverse;
        }

        @keyframes twinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.2) rotate(15deg); opacity: 0.7; }
        }

        .container {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 440px;
            padding: 22px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(255, 121, 156, 0.25);
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            border: 4px solid white;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            color: var(--primary-pink);
            margin-bottom: 3px;
            font-weight: 900;
            text-shadow: 1px 1px 0px white;
        }

        #mode-tag {
            text-align: center;
            color: #888;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 12px;
            border-radius: 20px;
            display: block;
            margin: 0 auto 6px auto;
            width: fit-content;
            border: 1px solid #FFE6EE;
        }

        .card {
            background: white;
            border: 2px solid var(--light-pink);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(255, 204, 221, 0.2);
        }

        .multi-tip {
            background: #FFF0F4;
            border: 1px dashed var(--primary-pink);
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            color: #D6456D;
            line-height: 1.45;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--primary-pink);
            font-size: 13px;
        }

        textarea {
            width: 100%;
            height: 75px;
            padding: 10px;
            border: 2px solid #FFE6EE;
            border-radius: 12px;
            font-size: 13px;
            background: #FFF9FA;
            outline: none;
            resize: none;
            font-family: monospace;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-pink);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(to right, #FF799C, #FF9EBA);
            box-shadow: 0 6px 20px rgba(255, 121, 156, 0.4);
        }

        .btn:hover { transform: translateY(-2px); }
        .btn.stop { background: linear-gradient(to right, #FFB3D1, #FF9999); }

        .btn-download {
            background: linear-gradient(to right, #FFA2BD, #FF799C);
            font-size: 13px;
            padding: 10px;
            margin-top: 6px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            padding: 6px 0;
            border-bottom: 1px dashed var(--light-pink);
        }

        .status-bar:last-child {
            border-bottom: none;
        }

        .status-value {
            font-weight: bold;
            color: var(--primary-pink);
        }

        /* 📊 運行摘要面板專屬樣式 */
        .summary-panel {
            background: #FFFFFF;
            border: 2px solid #FFCCDD;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 12px rgba(255, 121, 156, 0.15);
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #FFE6EE;
        }

        .summary-title {
            font-size: 14px;
            font-weight: 900;
            color: var(--primary-pink);
        }

        .risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .risk-badge.normal {
            background: #ECFDF5;
            color: #059669;
            border: 1px solid #A7F3D0;
        }

        .light-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .light-dot.green {
            background: #10B981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.8);
        }

        /* 4大核心數據方格（無目標達成率） */
        .stat-grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: #FFF9FA;
            border: 1px solid #FFE6EE;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }

        .stat-card-title {
            font-size: 10px;
            color: #888;
            margin-bottom: 2px;
        }

        .stat-card-val {
            font-size: 17px;
            font-weight: 900;
            color: var(--primary-pink);
        }

        .stat-card-time {
            font-size: 12px;
            font-weight: 800;
            color: #555;
            font-family: monospace;
            margin-top: 2px;
        }

        .video-list-header {
            font-size: 11px;
            font-weight: bold;
            color: #888;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .video-progress-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 130px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .video-progress-item {
            background: #FFFDFE;
            border: 1px solid #FFEBF1;
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .bv-tag {
            font-family: monospace;
            font-weight: bold;
            color: #444;
        }

        .play-count-badge {
            font-size: 11px;
            font-weight: bold;
            color: var(--primary-pink);
            background: #FFF0F4;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid #FFE0EA;
        }

        #log-window {
            height: 105px;
            background: #FFFDFE;
            border-radius: 14px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            border: 2px solid #FFE6EE;
            line-height: 1.5;
        }

        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #FFF0F4; padding-bottom: 2px; }
        .log-time { color: #BBB; margin-right: 6px; font-size: 10px; }
        .log-warn { color: #FF799C; font-weight: bold; }
        .log-error { color: #FF4444; }
        .log-success { color: #FF799C; font-weight: bold; }

        .hidden-channel {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            border: none;
        }
    </style>
</head>

<body>
    <!-- 5 個官方播放器硬體解碼通道（真實加載 B 站正版播放器並發送官方心跳） -->
    <iframe id="chan-1" class="hidden-channel" src="about:blank" allow="autoplay; encrypted-media; fullscreen"></iframe>
    <iframe id="chan-2" class="hidden-channel" src="about:blank" allow="autoplay; encrypted-media; fullscreen"></iframe>
    <iframe id="chan-3" class="hidden-channel" src="about:blank" allow="autoplay; encrypted-media; fullscreen"></iframe>
    <iframe id="chan-4" class="hidden-channel" src="about:blank" allow="autoplay; encrypted-media; fullscreen"></iframe>
    <iframe id="chan-5" class="hidden-channel" src="about:blank" allow="autoplay; encrypted-media; fullscreen"></iframe>

    <!-- 🎧 核心黑科技：系統特權級無聲音訊標籤（維持手機/平板切換 App 背景持續打榜） -->
    <audio id="bg-keepalive-audio" loop playsinline style="display:none;"></audio>

    <div class="container">
        <div style="text-align: center;">
            <h1>💗极禹刷啵 💗</h1>
            <p id="mode-tag">📱 真人播放模擬 · 支援手機後台掛機</p>
        </div>

        <div class="multi-tip">
            ✨ <b>真人播放模式</b>：真實調用 B 站官方播放器，隨機化停留 36~43 秒，拒絕機器人協議假請求。切出瀏覽器回訊息或刷 IG 依舊持續打榜！
        </div>

        <div id="manual-ui" class="card">
            <label for="bv-input">BV 號輸入 (每行一個)</label>
            <textarea id="bv-input" placeholder="BV1xx...&#10;BV2xx..."></textarea>
        </div>

        <button id="action-btn" class="btn">开始运行 (真實播放打榜)</button>

        <div class="card">
            <div class="status-bar">
                <span>待刷视频: <span id="video-count" class="status-value">0</span></span>
                <span>冷卻/批次倒計: <span id="next-run" class="status-value">--:--</span></span>
            </div>
            <div class="status-bar">
                <span>累計有效播放: <span id="success-count" class="status-value">0</span></span>
                <span id="status-text" class="status-value" style="font-size: 12px;">準備就緒</span>
            </div>
            <div style="font-size: 11px; text-align: right; color: #999; margin-top: 4px;">
                当前标签: <span id="session-tag" class="status-value" style="font-size: 11px;">⭐</span> |
                当前状态: <span id="current-state-text">準備就緒</span>
            </div>
        </div>

        <!-- 📊 運行摘要面板（已移除目標達成率，展示播放次數、輪次、開始與結束時間） -->
        <div class="summary-panel">
            <div class="summary-header">
                <span class="summary-title">📊 運行摘要面板</span>
                <div id="risk-badge" class="risk-badge normal">
                    <span class="light-dot green"></span>
                    <span>真人播放模擬 · 無風控</span>
                </div>
            </div>

            <!-- 4 大核心數據：播放次數、經歷輪次、開始時間、最近結束時間 -->
            <div class="stat-grid-4">
                <div class="stat-card">
                    <div class="stat-card-title">循環播放次數</div>
                    <div id="summary-total-plays" class="stat-card-val">0 次</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-title">經歷輪次</div>
                    <div id="summary-rounds" class="stat-card-val">第 0 輪</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-title">開始時間</div>
                    <div id="summary-start-time" class="stat-card-time">未開始</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-title">最近結束時間</div>
                    <div id="summary-end-time" class="stat-card-time">--:--:--</div>
                </div>
            </div>

            <div class="video-list-header">
                <span>各影片累計播放次數</span>
                <span id="active-video-count">共 0 支影片</span>
            </div>
            <div id="video-progress-container" class="video-progress-list">
                <div style="text-align: center; color: #bbb; font-size: 11px; padding: 10px;">
                    請貼入 BV 號，將實時記錄各影片累積播放次數
                </div>
            </div>
        </div>

        <div>
            <div id="log-window"></div>
        </div>
    </div>

    <script>
        if (!window.location.hash.includes('session=')) {
            const uniqueSession = Date.now().toString().slice(-6);
            window.location.hash = 'session=' + uniqueSession;
        }
        const currentSessionId = window.location.hash.split('session=')[1] || "⭐";

        const CONFIG = {
            minPlaySec: 36,       // 真人觀看最小停留秒數（超過 B 站官方 30 秒有效閾值）
            maxPlaySec: 43,       // 真人觀看最大停留秒數（擬人隨機浮動，防機器人特徵檢測）
            cycleCoolingSec: 90,  // 一整輪所有視頻刷完後的防吞去重冷卻秒數
            maxChannels: 5        // 5 通道同時並發
        };

        const todayKey = 'JIYU_DAILY_' + new Date().toISOString().slice(0, 10);

        let state = {
            isRunning: false,
            videos: [],
            countdownId: null,
            totalSent: 0,
            roundCount: 0,        // 經歷了幾輪
            startTimeStr: '未開始', // 本次開始時間
            lastEndTimeStr: '--:--:--', // 最近結束時間
            wakeLock: null,
            targetWakeTime: 0,    // 絕對時間戳：切換 App 也能自動校準
            dailyCounts: loadDailyCounts()
        };

        function loadDailyCounts() {
            try {
                const stored = localStorage.getItem(todayKey);
                return stored ? JSON.parse(stored) : {};
            } catch (e) { return {}; }
        }

        function saveDailyCounts() {
            try {
                localStorage.setItem(todayKey, JSON.stringify(state.dailyCounts));
            } catch (e) {}
        }

        const el = {
            btn: document.getElementById('action-btn'),
            bvInput: document.getElementById('bv-input'),
            log: document.getElementById('log-window'),
            count: document.getElementById('video-count'),
            nextRun: document.getElementById('next-run'),
            success: document.getElementById('success-count'),
            status: document.getElementById('status-text'),
            stateText: document.getElementById('current-state-text'),
            sessionTag: document.getElementById('session-tag'),
            summaryTotalPlays: document.getElementById('summary-total-plays'),
            summaryRounds: document.getElementById('summary-rounds'),
            summaryStartTime: document.getElementById('summary-start-time'),
            summaryEndTime: document.getElementById('summary-end-time'),
            activeCount: document.getElementById('active-video-count'),
            progressContainer: document.getElementById('video-progress-container'),
            bgAudio: document.getElementById('bg-keepalive-audio'),
            channels: [
                document.getElementById('chan-1'),
                document.getElementById('chan-2'),
                document.getElementById('chan-3'),
                document.getElementById('chan-4'),
                document.getElementById('chan-5')
            ]
        };

        el.sessionTag.innerText = "⭐#" + currentSessionId;

        const savedBvs = localStorage.getItem('JIYU_BV_SAVED');
        if (savedBvs) {
            el.bvInput.value = savedBvs;
            parseManualVideos();
            renderSummaryPanel();
        }

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            let colorClass = '';
            if (type === 'warn') colorClass = 'log-warn';
            if (type === 'error') colorClass = 'log-error';
            if (type === 'success') colorClass = 'log-success';
            entry.innerHTML = `<span class="log-time">${time}</span><span class="${colorClass}">${msg}</span>`;
            el.log.appendChild(entry);
            el.log.scrollTop = el.log.scrollHeight;
        }

        // 🎧 啟動手機無聲音頻保活（切換 App 仍享有背景播放特權）
        function startSilentAudioKeepAlive() {
            try {
                const silentWav = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
                el.bgAudio.src = silentWav;
                el.bgAudio.play().then(() => {
                    log('🎧 背景保活已就位（切換應用不會中斷打榜）', 'success');
                }).catch(() => {});

                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: "⭐️极禹打榜進行中⭐️",
                        artist: "真人播放模擬隊列",
                        album: "後台不中斷打榜"
                    });
                }

                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').then(lock => {
                        state.wakeLock = lock;
                    }).catch(() => {});
                }
            } catch (e) {}
        }

        function stopSilentAudioKeepAlive() {
            try {
                el.bgAudio.pause();
                if (state.wakeLock) {
                    state.wakeLock.release().catch(() => {});
                    state.wakeLock = null;
                }
            } catch (e) {}
        }

        // ⏱️ 切回網頁即時校驗時間戳
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && state.isRunning) {
                if (state.targetWakeTime > 0) {
                    const now = Date.now();
                    if (now >= state.targetWakeTime) {
                        log('⚡ 檢測到切出期間冷卻已完成，無縫開啟下一輪！', 'success');
                        clearInterval(state.countdownId);
                        state.targetWakeTime = 0;
                        runBoostCycle();
                    } else {
                        const remainSec = Math.round((state.targetWakeTime - now) / 1000);
                        log(`切回頁面，當前冷卻剩餘: ${remainSec} 秒`);
                    }
                }
            }
        });

        // 渲染摘要面板（無目標達成率，純統計次數、輪次、開始/結束時間）
        function renderSummaryPanel() {
            let totalToday = 0;
            state.videos.forEach(v => {
                totalToday += (state.dailyCounts[v.bvid] || 0);
            });

            el.summaryTotalPlays.innerText = totalToday + ' 次';
            el.summaryRounds.innerText = '第 ' + state.roundCount + ' 輪';
            el.summaryStartTime.innerText = state.startTimeStr;
            el.summaryEndTime.innerText = state.lastEndTimeStr;
            el.activeCount.innerText = `共 ${state.videos.length} 支影片`;

            if (state.videos.length === 0) {
                el.progressContainer.innerHTML = `
                    <div style="text-align: center; color: #bbb; font-size: 11px; padding: 10px;">
                        請貼入 BV 號，將實時記錄各影片累積播放次數
                    </div>`;
                return;
            }

            let html = '';
            state.videos.forEach(v => {
                const count = state.dailyCounts[v.bvid] || 0;
                html += `
                    <div class="video-progress-item">
                        <span class="bv-tag">${v.bvid}</span>
                        <span class="play-count-badge">已播放 ${count} 次</span>
                    </div>
                `;
            });
            el.progressContainer.innerHTML = html;
        }

        function parseManualVideos() {
            const text = el.bvInput.value;
            if (!text) return;
            const bvRegex = /BV[a-zA-Z0-9]{10}/gi;
            const matchedBvs = text.match(bvRegex);
            if (!matchedBvs) {
                state.videos = [];
                renderSummaryPanel();
                return;
            }
            const uniqueBvs = [...new Set(matchedBvs.map(bv => 'BV' + bv.slice(2)))];
            state.videos = uniqueBvs.map(bv => ({ bvid: bv }));
            el.count.innerText = state.videos.length;
            localStorage.setItem('JIYU_BV_SAVED', text);
            renderSummaryPanel();
        }

        function sleep(ms) {
            return new Promise(resolve => {
                const start = Date.now();
                const timer = setInterval(() => {
                    if (!state.isRunning || Date.now() - start >= ms) {
                        clearInterval(timer);
                        resolve();
                    }
                }, 100);
            });
        }

        // 🚀 真人播放模擬主程序：真正加載官方播放器，絕不使用假 API 請求
        async function runBoostCycle() {
            if (!state.isRunning) return;
            state.roundCount++;
            log(`🎬 開始第 ${state.roundCount} 輪播放（5 通道真人模擬）...`, 'success');
            el.status.innerText = `第 ${state.roundCount} 輪執行中...`;
            el.stateText.innerText = `正在進行第 ${state.roundCount} 輪`;
            renderSummaryPanel();

            for (let i = 0; i < state.videos.length; i += CONFIG.maxChannels) {
                if (!state.isRunning) break;

                const currentBatch = state.videos.slice(i, i + CONFIG.maxChannels);
                const batchBvs = currentBatch.map(v => v.bvid);

                log(`▶️ 加載官方播放器: ${batchBvs.join(' | ')}`);

                // 核心關鍵：載入真正的官方播放器 iframe，讓 B 站內核自行完成視頻切片解碼與官方合法心跳上報
                currentBatch.forEach((v, idx) => {
                    const chan = el.channels[idx];
                    if (chan) {
                        chan.src = `https://player.bilibili.com/player.html?bvid=${v.bvid}&autoplay=1&muted=1&page=1`;
                    }
                });

                // 擬人化隨機停留時長（36 ~ 43 秒，避開固定時長作弊檢測）
                const randomizedPlaySec = Math.floor(CONFIG.minPlaySec + Math.random() * (CONFIG.maxPlaySec - CONFIG.minPlaySec + 1));
                const batchEndTs = Date.now() + randomizedPlaySec * 1000;

                while (state.isRunning) {
                    const now = Date.now();
                    const remain = Math.max(0, Math.ceil((batchEndTs - now) / 1000));
                    el.status.innerText = `真人觀看累計: ${remain}s (同時${currentBatch.length}個)`;
                    el.nextRun.innerText = `00:${remain.toString().padStart(2, '0')}`;
                    if (remain <= 0) break;
                    await sleep(1000);
                }

                if (!state.isRunning) break;

                // 本組播放完畢，次數真切入庫
                currentBatch.forEach(v => {
                    state.totalSent++;
                    state.dailyCounts[v.bvid] = (state.dailyCounts[v.bvid] || 0) + 1;
                    log(`✅ ${v.bvid} 官方播放心跳完成 (累計播放 ${state.dailyCounts[v.bvid]} 次)`, 'success');
                });

                saveDailyCounts();
                el.success.innerText = state.totalSent;
                renderSummaryPanel();

                if (i + CONFIG.maxChannels < state.videos.length) {
                    // 擬人換片間歇 2.5 ~ 4.5 秒
                    const switchDelay = 2500 + Math.floor(Math.random() * 2000);
                    log(`⚡ 擬人換片間歇 ${(switchDelay/1000).toFixed(1)} 秒後播放下一批...`);
                    await sleep(switchDelay);
                }
            }

            // 清除當前播放器防止資源佔用
            el.channels.forEach(ch => { if (ch) ch.src = 'about:blank'; });

            if (state.isRunning) {
                // 記錄本輪結束時間
                state.lastEndTimeStr = new Date().toLocaleTimeString('zh-CN', { hour12: false });
                renderSummaryPanel();
                log(`🏁 第 ${state.roundCount} 輪播放完畢！冷卻 ${CONFIG.cycleCoolingSec} 秒去重防吞後進入下一輪`);
                startCountdown(CONFIG.cycleCoolingSec);
            }
        }

        // ⏱️ 防切 App 凍結倒計時
        function startCountdown(seconds) {
            el.status.innerText = '防吞去重冷卻中...';
            el.stateText.innerText = '冷卻休眠中💤';
            state.targetWakeTime = Date.now() + seconds * 1000;

            clearInterval(state.countdownId);
            state.countdownId = setInterval(() => {
                if (!state.isRunning) {
                    clearInterval(state.countdownId);
                    return;
                }
                const now = Date.now();
                const remaining = Math.max(0, Math.ceil((state.targetWakeTime - now) / 1000));

                if (remaining <= 0) {
                    clearInterval(state.countdownId);
                    state.targetWakeTime = 0;
                    runBoostCycle();
                    return;
                }
                const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                const s = (remaining % 60).toString().padStart(2, '0');
                el.nextRun.innerText = `${m}:${s}`;
            }, 1000);
        }

        async function start() {
            state.isRunning = true;
            state.startTimeStr = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            startSilentAudioKeepAlive();
            el.btn.innerText = '停止打榜';
            el.btn.classList.add('stop');
            el.bvInput.disabled = true;

            parseManualVideos();
            if (state.videos.length === 0) {
                log('請輸入正確的 BV 號', 'error');
                stop();
                return;
            }

            el.count.innerText = state.videos.length;
            log(`${state.videos.length} 個視頻準備就緒💗（真人播放模式已啟動，開始於 ${state.startTimeStr}）`, 'success');
            renderSummaryPanel();
            runBoostCycle();
        }

        function stop() {
            state.isRunning = false;
            state.targetWakeTime = 0;
            state.lastEndTimeStr = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            clearInterval(state.countdownId);
            stopSilentAudioKeepAlive();
            el.channels.forEach(ch => { if (ch) ch.src = 'about:blank'; });
            el.btn.innerText = '开始运行 (真實播放打榜)';
            el.btn.classList.remove('stop');
            el.bvInput.disabled = false;
            el.status.innerText = '已停止';
            el.stateText.innerText = '已停止';
            renderSummaryPanel();
            log(`已手動停止，結束於 ${state.lastEndTimeStr}`, 'warn');
        }

        el.btn.addEventListener('click', () => {
            if (state.isRunning) stop(); else start();
        });

        el.bvInput.addEventListener('input', () => {
            parseManualVideos();
        });

        log(`💞极禹刷啵⭐️#${currentSessionId} 已就緒 (真人模擬·後台保活版)`);
    </script>
</body>

</html>
