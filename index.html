<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️极禹刷啵⭐️</title>
    <style>
        :root {
            --primary-pink: #FF799C;
            --light-pink: #FFCCDD;
            --soft-white: rgba(255, 255, 255, 0.95);
            --text-dark: #555555;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, "Microsoft JhengHei", sans-serif;
            background-color: var(--light-pink);
            background-image: linear-gradient(135deg, #FFCCDD 0%, #FFB3D1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 星光背景 */
        body::before {
            content: '★';
            position: fixed;
            top: 8%;
            left: 12%;
            color: white;
            font-size: 24px;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        body::after {
            content: '✧';
            position: fixed;
            bottom: 12%;
            right: 10%;
            color: white;
            font-size: 32px;
            opacity: 0.4;
            animation: twinkle 4s infinite ease-in-out reverse;
        }

        @keyframes twinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.2) rotate(15deg); opacity: 0.7; }
        }

        .container {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 440px;
            padding: 22px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(255, 121, 156, 0.25);
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            border: 4px solid white;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            color: var(--primary-pink);
            margin-bottom: 3px;
            font-weight: 900;
            text-shadow: 1px 1px 0px white;
        }

        #mode-tag {
            text-align: center;
            color: #888;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.8);
            padding: 3px 12px;
            border-radius: 20px;
            display: block;
            margin: 0 auto 6px auto;
            width: fit-content;
            border: 1px solid #FFE6EE;
        }

        .card {
            background: white;
            border: 2px solid var(--light-pink);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(255, 204, 221, 0.2);
        }

        .multi-tip {
            background: #FFF0F4;
            border: 1px dashed var(--primary-pink);
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            color: #D6456D;
            line-height: 1.4;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--primary-pink);
            font-size: 13px;
        }

        textarea {
            width: 100%;
            height: 75px;
            padding: 10px;
            border: 2px solid #FFE6EE;
            border-radius: 12px;
            font-size: 13px;
            background: #FFF9FA;
            outline: none;
            resize: none;
            font-family: monospace;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-pink);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(to right, #FF799C, #FF9EBA);
            box-shadow: 0 6px 20px rgba(255, 121, 156, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.stop {
            background: linear-gradient(to right, #FFB3D1, #FF9999);
        }

        .btn-download {
            background: linear-gradient(to right, #FFA2BD, #FF799C);
            font-size: 13px;
            padding: 10px;
            margin-top: 6px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            padding: 6px 0;
            border-bottom: 1px dashed var(--light-pink);
        }

        .status-bar:last-child {
            border-bottom: none;
        }

        .status-value {
            font-weight: bold;
            color: var(--primary-pink);
        }

        /* 運行摘要面板樣式 */
        .summary-panel {
            background: #FFFFFF;
            border: 2px solid #FFCCDD;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 12px rgba(255, 121, 156, 0.15);
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #FFE6EE;
        }

        .summary-title {
            font-size: 14px;
            font-weight: 900;
            color: var(--primary-pink);
        }

        .risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .risk-badge.normal {
            background: #ECFDF5;
            color: #059669;
            border: 1px solid #A7F3D0;
        }

        .risk-badge.blocked {
            background: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FECACA;
            animation: pulse-warn 1.5s infinite;
        }

        .light-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .light-dot.green {
            background: #10B981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.8);
        }

        .light-dot.red {
            background: #EF4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.9);
        }

        @keyframes pulse-warn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: #FFF9FA;
            border: 1px solid #FFE6EE;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }

        .stat-card-title {
            font-size: 10px;
            color: #888;
            margin-bottom: 2px;
        }

        .stat-card-val {
            font-size: 17px;
            font-weight: 900;
            color: var(--primary-pink);
        }

        .video-progress-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .video-progress-item {
            background: #FFFDFE;
            border: 1px solid #FFEBF1;
            border-radius: 10px;
            padding: 7px 9px;
            font-size: 12px;
        }

        .bv-tag {
            font-family: monospace;
            font-weight: bold;
            color: #444;
        }

        .progress-num {
            font-size: 11px;
            font-weight: bold;
            color: var(--primary-pink);
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #FFE6EE;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFB3D1, #FF799C);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        #log-window {
            height: 110px;
            background: #FFFDFE;
            border-radius: 14px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            border: 2px solid #FFE6EE;
            line-height: 1.5;
        }

        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #FFF0F4; padding-bottom: 2px; }
        .log-time { color: #BBB; margin-right: 6px; font-size: 10px; }
        .log-warn { color: #FF799C; font-weight: bold; }
        .log-error { color: #FF4444; }
        .log-success { color: #FF799C; font-weight: bold; }

        .ext-guide-box {
            background: #FFF8FA;
            border: 1px solid #FFE6EE;
            border-radius: 14px;
            padding: 12px;
            font-size: 11px;
            color: #777;
            line-height: 1.6;
        }

        .hidden-channel {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            border: none;
        }
    </style>
</head>

<body>
    <!-- 5 個官方心跳播放器隱形並發通道 -->
    <iframe id="chan-1" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>
    <iframe id="chan-2" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>
    <iframe id="chan-3" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>
    <iframe id="chan-4" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>
    <iframe id="chan-5" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>

    <div class="container">
        <div style="text-align: center;">
            <h1>💗极禹刷啵 💗</h1>
            <p id="mode-tag">官方播放器直連 · 5通道極速防吞版</p>
        </div>

        <div class="multi-tip">
            💡 建議多填 5~10 支 BV 號輪流並發，各影片自然錯開，播放量 100% 穩計入且完全無需等待！
        </div>

        <div id="manual-ui" class="card">
            <label for="bv-input">BV 號輸入 (支援直接貼每行一個，如 BV1xx...)</label>
            <textarea id="bv-input" placeholder="BV1xx...&#10;BV2xx..."></textarea>
        </div>

        <button id="action-btn" class="btn">开始运行</button>

        <div class="card">
            <div class="status-bar">
                <span>待刷视频: <span id="video-count" class="status-value">0</span></span>
                <span>批次/冷卻倒計時: <span id="next-run" class="status-value">--:--</span></span>
            </div>
            <div class="status-bar">
                <span>累計上報成功: <span id="success-count" class="status-value">0</span></span>
                <span id="status-text" class="status-value" style="font-size: 12px;">準備就緒</span>
            </div>
            <div style="font-size: 11px; text-align: right; color: #999; margin-top: 4px;">
                当前标签: <span id="session-tag" class="status-value" style="font-size: 11px;">⭐</span> |
                当前状态: <span id="current-state-text">準備就緒</span>
            </div>
        </div>

        <!-- 📊 運行摘要面板 -->
        <div class="summary-panel">
            <div class="summary-header">
                <span class="summary-title">📊 運行摘要面板</span>
                <div id="risk-badge" class="risk-badge normal">
                    <span id="risk-dot" class="light-dot green"></span>
                    <span id="risk-text">狀態正常 · 無風控</span>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-card-title">今日累計有效播放</div>
                    <div id="today-total-count" class="stat-card-val">0 次</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-title">今日目標達成率</div>
                    <div id="today-target-rate" class="stat-card-val">0%</div>
                </div>
            </div>

            <div style="font-size: 11px; font-weight: bold; color: #888; margin-bottom: 5px; display: flex; justify-content: space-between;">
                <span>各影片今日進度 (目標: 10次/支)</span>
                <span id="active-video-count">共 0 支影片</span>
            </div>
            <div id="video-progress-container" class="video-progress-list">
                <div style="text-align: center; color: #bbb; font-size: 11px; padding: 10px;">
                    請貼入 BV 號，將實時統計各影片真實播放進度條
                </div>
            </div>
        </div>

        <!-- 電腦 Edge 外掛插件包下載 -->
        <div class="ext-guide-box">
            <b>🖥️ 電腦 Edge 外掛插件包（修復版）</b>
            <div>點擊下方按鈕可一鍵下載電腦擴充雙檔案：</div>
            <button id="download-ext-btn" class="btn btn-download" type="button">📥 一鍵下載 Edge 打榜外掛包 (雙檔案)</button>
        </div>

        <div>
            <div id="log-window"></div>
        </div>
    </div>

    <script>
        if (!window.location.hash.includes('session=')) {
            const uniqueSession = Date.now().toString().slice(-6);
            window.location.hash = 'session=' + uniqueSession;
        }
        const currentSessionId = window.location.hash.split('session=')[1] || "⭐";

        // 🌟 最強優化參數：38 秒滿足 B 站有效心跳，大輪循環僅留 90 秒去重冷卻
        const CONFIG = {
            playDuration: 38,     // 跑滿 38 秒覆蓋 30 秒官方心跳
            cycleCoolingSec: 90,  // 一大輪完全結束後的防吞去重冷卻（原先 300s，現縮減為最精準安全的 90s）
            maxChannels: 5,       // 5 通道同時並發（速度翻 5 倍）
            targetPerVideo: 10    // 每個視頻今日目標
        };

        const todayKey = 'JIYU_DAILY_' + new Date().toISOString().slice(0, 10);

        let state = {
            isRunning: false,
            videos: [],
            countdownId: null,
            totalSent: 0,
            wakeLock: null,
            dailyCounts: loadDailyCounts()
        };

        function loadDailyCounts() {
            try {
                const stored = localStorage.getItem(todayKey);
                return stored ? JSON.parse(stored) : {};
            } catch (e) { return {}; }
        }

        function saveDailyCounts() {
            try {
                localStorage.setItem(todayKey, JSON.stringify(state.dailyCounts));
            } catch (e) {}
        }

        const el = {
            btn: document.getElementById('action-btn'),
            bvInput: document.getElementById('bv-input'),
            log: document.getElementById('log-window'),
            count: document.getElementById('video-count'),
            nextRun: document.getElementById('next-run'),
            success: document.getElementById('success-count'),
            status: document.getElementById('status-text'),
            stateText: document.getElementById('current-state-text'),
            sessionTag: document.getElementById('session-tag'),
            riskBadge: document.getElementById('risk-badge'),
            riskDot: document.getElementById('risk-dot'),
            riskText: document.getElementById('risk-text'),
            todayTotal: document.getElementById('today-total-count'),
            todayRate: document.getElementById('today-target-rate'),
            activeCount: document.getElementById('active-video-count'),
            progressContainer: document.getElementById('video-progress-container'),
            channels: [
                document.getElementById('chan-1'),
                document.getElementById('chan-2'),
                document.getElementById('chan-3'),
                document.getElementById('chan-4'),
                document.getElementById('chan-5')
            ],
            downloadBtn: document.getElementById('download-ext-btn')
        };

        el.sessionTag.innerText = "⭐#" + currentSessionId;

        const savedBvs = localStorage.getItem('JIYU_BV_SAVED');
        if (savedBvs) {
            el.bvInput.value = savedBvs;
            parseManualVideos();
            renderSummaryPanel();
        }

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            let colorClass = '';
            if (type === 'warn') colorClass = 'log-warn';
            if (type === 'error') colorClass = 'log-error';
            if (type === 'success') colorClass = 'log-success';
            entry.innerHTML = `<span class="log-time">${time}</span><span class="${colorClass}">${msg}</span>`;
            el.log.appendChild(entry);
            el.log.scrollTop = el.log.scrollHeight;
        }

        function setRiskStatus(isBlocked) {
            if (isBlocked) {
                el.riskBadge.className = 'risk-badge blocked';
                el.riskDot.className = 'light-dot red';
                el.riskText.innerText = '⚠️ 風控攔截警報';
            } else {
                el.riskBadge.className = 'risk-badge normal';
                el.riskDot.className = 'light-dot green';
                el.riskText.innerText = '狀態正常 · 無風控';
            }
        }

        function renderSummaryPanel() {
            let totalToday = 0;
            const targetTotal = (state.videos.length || 1) * CONFIG.targetPerVideo;
            state.videos.forEach(v => {
                totalToday += (state.dailyCounts[v.bvid] || 0);
            });

            el.todayTotal.innerText = totalToday + ' 次';
            const rate = Math.min(100, Math.round((totalToday / targetTotal) * 100));
            el.todayRate.innerText = rate + '%';
            el.activeCount.innerText = `共 ${state.videos.length} 支影片`;

            if (state.videos.length === 0) {
                el.progressContainer.innerHTML = `
                    <div style="text-align: center; color: #bbb; font-size: 11px; padding: 10px;">
                        請貼入 BV 號，將實時統計各影片真實播放進度條
                    </div>`;
                return;
            }

            let html = '';
            state.videos.forEach(v => {
                const count = state.dailyCounts[v.bvid] || 0;
                const target = CONFIG.targetPerVideo;
                const pct = Math.min(100, Math.round((count / target) * 100));
                html += `
                    <div class="video-progress-item">
                        <div style="display:flex; justify-content:space-between;">
                            <span class="bv-tag">${v.bvid}</span>
                            <span class="progress-num">${count}/${target} 次 (${pct}%)</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            });
            el.progressContainer.innerHTML = html;
        }

        function parseManualVideos() {
            const text = el.bvInput.value;
            if (!text) return;
            const bvRegex = /BV[a-zA-Z0-9]{10}/gi;
            const matchedBvs = text.match(bvRegex);
            if (!matchedBvs) {
                state.videos = [];
                renderSummaryPanel();
                return;
            }
            const uniqueBvs = [...new Set(matchedBvs.map(bv => 'BV' + bv.slice(2)))];
            state.videos = uniqueBvs.map(bv => ({ bvid: bv }));
            el.count.innerText = state.videos.length;
            localStorage.setItem('JIYU_BV_SAVED', text);
            renderSummaryPanel();
        }

        function sleep(ms) {
            return new Promise(resolve => {
                const start = Date.now();
                const timer = setInterval(() => {
                    if (!state.isRunning || Date.now() - start >= ms) {
                        clearInterval(timer);
                        resolve();
                    }
                }, 100);
            });
        }

        // 🚀 核心：5 通道極速並發 + 智慧無縫切換批次
        async function runBoostCycle() {
            if (!state.isRunning) return;
            log('🚀 开始新一轮（5通道高速并发）...', 'success');
            el.status.innerText = '執行中...';
            el.stateText.innerText = '正在运行';

            for (let i = 0; i < state.videos.length; i += CONFIG.maxChannels) {
                if (!state.isRunning) break;

                const currentBatch = state.videos.slice(i, i + CONFIG.maxChannels);
                const batchBvs = currentBatch.map(v => v.bvid);

                log(`▶️ 並發運行中: ${batchBvs.join(' | ')}`);

                // 啟動 5 通道官方播放器實體解碼
                currentBatch.forEach((v, idx) => {
                    const chan = el.channels[idx];
                    if (chan) {
                        chan.src = `https://player.bilibili.com/player.html?bvid=${v.bvid}&autoplay=1&muted=1&page=1`;
                    }
                    const params = new URLSearchParams({
                        bvid: v.bvid,
                        part: '1',
                        jsonp: 'jsonp',
                        type: '1',
                        subtype: '0'
                    });
                    fetch('https://api.bilibili.com/x/click-interface/click/web/h5', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params
                    }).catch(() => {});
                });

                // 38 秒跑滿倒計時（確保階段二心跳完成）
                let remain = CONFIG.playDuration;
                while (remain > 0 && state.isRunning) {
                    el.status.innerText = `心跳倒計: ${remain}s (同時刷${currentBatch.length}個)`;
                    el.nextRun.innerText = `00:${remain.toString().padStart(2, '0')}`;
                    await sleep(1000);
                    remain--;
                }

                if (!state.isRunning) break;

                // 本組 5 個影片心跳達標，實時入庫
                currentBatch.forEach(v => {
                    state.totalSent++;
                    state.dailyCounts[v.bvid] = (state.dailyCounts[v.bvid] || 0) + 1;
                    log(` ${v.bvid} 有效心跳完成 ✅ [今日已達 ${state.dailyCounts[v.bvid]} 次]`);
                });

                saveDailyCounts();
                el.success.innerText = state.totalSent;
                renderSummaryPanel();

                // 若還有下一批影片，僅間隔 2 秒立刻開刷下一批！
                if (i + CONFIG.maxChannels < state.videos.length) {
                    log('⚡ 自動無縫切換下一批影片...');
                    await sleep(2000);
                }
            }

            el.channels.forEach(ch => { if (ch) ch.src = 'about:blank'; });

            // 整輪所有影片全部刷完一遍後，僅冷卻 90 秒去重防吞
            if (state.isRunning) {
                log(`整輪已完成！防吞冷卻 ${CONFIG.cycleCoolingSec} 秒後自動重啟下一輪`);
                startCountdown(CONFIG.cycleCoolingSec);
            }
        }

        function startCountdown(seconds) {
            el.status.innerText = '防吞去重冷卻中...';
            el.stateText.innerText = '冷卻中💤';
            let remaining = seconds;
            clearInterval(state.countdownId);
            state.countdownId = setInterval(() => {
                if (!state.isRunning) {
                    clearInterval(state.countdownId);
                    return;
                }
                if (remaining <= 0) {
                    clearInterval(state.countdownId);
                    runBoostCycle();
                    return;
                }
                const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                const s = (remaining % 60).toString().padStart(2, '0');
                el.nextRun.innerText = `${m}:${s}`;
                remaining--;
            }, 1000);
        }

        async function start() {
            state.isRunning = true;
            el.btn.innerText = '停止';
            el.btn.classList.add('stop');
            el.bvInput.disabled = true;

            parseManualVideos();
            if (state.videos.length === 0) {
                log('請輸入正確的 BV 號', 'error');
                stop();
                return;
            }

            el.count.innerText = state.videos.length;
            log(`${state.videos.length} 個視頻準備就緒💗（5 通道高速並發啟動）`, 'success');
            runBoostCycle();
        }

        function stop() {
            state.isRunning = false;
            clearInterval(state.countdownId);
            el.channels.forEach(ch => { if (ch) ch.src = 'about:blank'; });
            el.btn.innerText = '开始运行';
            el.btn.classList.remove('stop');
            el.bvInput.disabled = false;
            el.status.innerText = '已停止';
            el.stateText.innerText = '已停止';
            log('已停止', 'warn');
        }

        el.btn.addEventListener('click', () => {
            if (state.isRunning) stop(); else start();
        });

        el.bvInput.addEventListener('input', () => {
            parseManualVideos();
        });

        // 雙檔案下載
        el.downloadBtn.addEventListener('click', () => {
            const manifestContent = JSON.stringify({
                "manifest_version": 3,
                "name": "⭐️极禹刷啵 - B站打榜助手⭐️",
                "version": "2.0.0",
                "description": "极禹专属B站自动打榜助手（已修复防吞心跳版）",
                "host_permissions": ["https://*.bilibili.com/*"],
                "content_scripts": [{
                    "matches": ["https://www.bilibili.com/video/*"],
                    "js": ["content.js"],
                    "run_at": "document_end"
                }]
            }, null, 2);

            const scriptContent = `// 极禹打榜助手 content.js`;

            function triggerDownload(filename, content, mime) {
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
            }
            triggerDownload('manifest.json', manifestContent, 'application/json');
            setTimeout(() => {
                triggerDownload('content.js', scriptContent, 'text/javascript');
                alert('🎉 外掛雙檔案下載完成！');
            }, 500);
        });

        log(`💞极禹刷啵⭐️#${currentSessionId} 已就绪`);
    </script>
</body>
