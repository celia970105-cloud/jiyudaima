<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️极禹刷啵⭐️</title>
    <style>
        /* 🎨 精準配色：#FFCCDD 與 #FF799C */
        :root {
            --primary-pink: #FF799C;
            --light-pink: #FFCCDD;
            --soft-white: rgba(255, 255, 255, 0.95);
            --star-color: #FFB3D1;
            --text-dark: #555555;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, "Microsoft JhengHei", sans-serif;
            background-color: var(--light-pink);
            background-image: linear-gradient(135deg, #FFCCDD 0%, #FFB3D1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ✨ 星光閃爍 */
        body::before {
            content: '★';
            position: fixed;
            top: 8%;
            left: 12%;
            color: white;
            font-size: 24px;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        body::after {
            content: '✧';
            position: fixed;
            bottom: 12%;
            right: 10%;
            color: white;
            font-size: 32px;
            opacity: 0.4;
            animation: twinkle 4s infinite ease-in-out reverse;
        }

        @keyframes twinkle {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.2) rotate(15deg);
                opacity: 0.7;
            }
        }

        .container {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(255, 121, 156, 0.25);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            border: 4px solid white;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            color: var(--primary-pink);
            margin-bottom: 5px;
            font-weight: 900;
            text-shadow: 1px 1px 0px white;
        }

        #mode-tag {
            text-align: center;
            color: #888;
            font-size: 11px;
            font-style: italic;
            background: rgba(255, 255, 255, 0.8);
            padding: 3px 12px;
            border-radius: 20px;
            display: block;
            margin: 0 auto 10px auto;
            width: fit-content;
            border: 1px solid #FFE6EE;
        }

        .card {
            background: white;
            border: 2px solid var(--light-pink);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(255, 204, 221, 0.2);
        }

        .multi-tip {
            background: #FFF0F4;
            border: 1px dashed var(--primary-pink);
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            color: #D6456D;
            line-height: 1.4;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-pink);
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 2px solid #FFE6EE;
            border-radius: 14px;
            font-size: 13px;
            background: #FFF9FA;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-pink);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(to right, #FF799C, #FF9EBA);
            box-shadow: 0 6px 20px rgba(255, 121, 156, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 121, 156, 0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.stop {
            background: linear-gradient(to right, #FFB3D1, #FF9999);
            box-shadow: 0 6px 15px rgba(255, 153, 153, 0.3);
        }

        .btn-download {
            background: linear-gradient(to right, #FFA2BD, #FF799C);
            font-size: 13px;
            padding: 11px;
            box-shadow: 0 4px 12px rgba(255, 121, 156, 0.25);
            margin-top: 4px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            padding: 8px 0;
            border-bottom: 1px dashed var(--light-pink);
        }

        .status-bar:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 500;
        }

        .status-value {
            font-weight: bold;
            color: var(--primary-pink);
        }

        #log-window {
            height: 130px;
            background: #FFFDFE;
            border-radius: 14px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-y: auto;
            border: 2px solid #FFE6EE;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 6px;
            border-bottom: 1px solid #FFF0F4;
            padding-bottom: 3px;
        }

        .log-time {
            color: #BBB;
            margin-right: 8px;
            font-size: 11px;
        }

        .log-warn {
            color: #FF799C;
            font-weight: bold;
        }

        .log-error {
            color: #FF4444;
        }

        .log-success {
            color: #FF799C;
            font-weight: bold;
        }

        .ext-guide-box {
            background: #FFF8FA;
            border: 1px solid #FFE6EE;
            border-radius: 14px;
            padding: 12px;
            font-size: 11px;
            color: #777;
            line-height: 1.6;
        }

        .ext-guide-box b {
            color: #FF799C;
        }

        #bili-silent-frame {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            border: none;
        }
    </style>
</head>

<body>
    <iframe id="bili-silent-frame" src="about:blank" allow="autoplay"></iframe>

    <div class="container">
        <div style="text-align: center;">
            <h1>💗极禹刷啵 💗</h1>
            <p id="mode-tag">EDGE Mode</p>
        </div>

        <div class="multi-tip"> 建立edge账号后，点击头像 新增无痕页面 每个页面登录不同的edge账号和b站号，最多3-5个避免ip风险！
        </div>

        <div id="manual-ui" class="card">
            <label for="bv-input">BV 号输入 (每行一个)</label>
            <textarea id="bv-input" placeholder="BV1xx...&#10;BV2xx...&#10;..."></textarea>
        </div>

        <button id="action-btn" class="btn">开始运行</button>

        <div class="card">
            <div class="status-bar">
                <span class="status-label">待刷视频: <span id="video-count" class="status-value">0</span></span>
                <span class="status-label">下次循环: <span id="next-run" class="status-value">--:--</span></span>
            </div>
            <div class="status-bar">
                <span class="status-label">累计发送请求次数: <span id="success-count" class="status-value">0</span></span>
                <span id="status-text" class="status-value" style="font-size: 12px;"></span>
            </div>
            <div style="font-size: 11px; text-align: right; color: #999; margin-top: 5px;">
                当前标签: <span id="session-tag" class="status-value" style="font-size: 11px;">⭐</span> |
                当前状态: <span id="current-state-text">准备就绪</span>
            </div>
        </div>

        <!-- 粉絲一鍵下載外掛專區 -->
        <div class="ext-guide-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <b>🖥️ 電腦 Edge 外掛插件包（修復版）</b>
            </div>
            <div>1️⃣ 點擊下方按鈕，自動下載 <code>manifest.json</code> 與 <code>content.js</code></div>
            <div>2️⃣ 桌面新建資料夾，把這兩個檔案放進去</div>
            <div>3️⃣ Edge 打開 <code>edge://extensions/</code> 開啟【開發者模式】</div>
            <div>4️⃣ 點擊【載入解壓縮的擴充功能】選擇該資料夾即可！</div>
            <button id="download-ext-btn" class="btn btn-download" type="button">📥 一鍵下載 Edge 打榜外掛包 (雙檔案)</button>
        </div>

        <div>
            <div id="log-window"></div>
        </div>
    </div>

    <script>
        if (!window.location.hash.includes('session=')) {
            const uniqueSession = Date.now().toString().slice(-6);
            window.location.hash = 'session=' + uniqueSession;
        }
        const currentSessionId = window.location.hash.split('session=')[1] || "⭐";

        const CONFIG = { intervalMinutes: 6 };

        let state = {
            isRunning: false,
            videos: [],
            countdownId: null,
            totalSent: 0,
            wakeLock: null
        };

        const el = {
            btn: document.getElementById('action-btn'),
            manualUi: document.getElementById('manual-ui'),
            bvInput: document.getElementById('bv-input'),
            log: document.getElementById('log-window'),
            count: document.getElementById('video-count'),
            nextRun: document.getElementById('next-run'),
            success: document.getElementById('success-count'),
            status: document.getElementById('status-text'),
            modeTag: document.getElementById('mode-tag'),
            stateText: document.getElementById('current-state-text'),
            sessionTag: document.getElementById('session-tag'),
            frame: document.getElementById('bili-silent-frame'),
            downloadBtn: document.getElementById('download-ext-btn')
        };

        el.sessionTag.innerText = "⭐#" + currentSessionId;

        // 本地保存上次輸入的 BV 號
        const savedBvs = localStorage.getItem('JIYU_BV_SAVED');
        if (savedBvs) {
            el.bvInput.value = savedBvs;
        }

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            let colorClass = '';
            if (type === 'warn') colorClass = 'log-warn';
            if (type === 'error') colorClass = 'log-error';
            if (type === 'success') colorClass = 'log-success';
            entry.innerHTML = `<span class="log-time">${time}</span><span class="${colorClass}">${msg}</span>`;
            el.log.appendChild(entry);
            el.log.scrollTop = el.log.scrollHeight;
        }

        // 後台防休眠
        let audioCtx = null;
        function enableBackgroundKeepAlive() {
            try {
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').then(lock => {
                        state.wakeLock = lock;
                    }).catch(() => {});
                }
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        audioCtx = new AudioContext();
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        gain.gain.value = 0.0001;
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                    }
                }
            } catch (e) {}
        }

        function parseManualVideos() {
            const text = el.bvInput.value;
            if (!text) return;

            const bvRegex = /BV[a-zA-Z0-9]{10}/gi;
            const matchedBvs = text.match(bvRegex);

            if (!matchedBvs) {
                state.videos = [];
                return;
            }

            const uniqueBvs = [...new Set(matchedBvs.map(bv => {
                return 'BV' + bv.slice(2);
            }))];

            state.videos = uniqueBvs.map(bv => ({
                bvid: bv,
                title: bv
            }));

            localStorage.setItem('JIYU_BV_SAVED', text);
        }

        function sleep(ms) {
            return new Promise(resolve => {
                const start = Date.now();
                const timer = setInterval(() => {
                    if (!state.isRunning || Date.now() - start >= ms) {
                        clearInterval(timer);
                        resolve();
                    }
                }, 100);
            });
        }

        async function runBoostCycle() {
            if (!state.isRunning) return;
            log('🚀 开始新一轮...', 'success');
            el.status.innerText = '執行中...';
            el.stateText.innerText = '正在运行';

            for (let v of state.videos) {
                if (!state.isRunning) break;

                try {
                    if (el.frame) {
                        el.frame.src = `https://player.bilibili.com/player.html?bvid=${v.bvid}&autoplay=1&muted=1`;
                    }

                    const params = new URLSearchParams({
                        bvid: v.bvid,
                        part: '1',
                        jsonp: 'jsonp',
                        type: '1',
                        subtype: '0'
                    });

                    fetch('https://api.bilibili.com/x/click-interface/click/web/h5', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params
                    }).catch(() => {});

                    state.totalSent++;
                    el.success.innerText = state.totalSent;
                    log(` ${v.bvid} 播放成功 ✅`);
                } catch (e) {
                    log(`${v.bvid} ❌`, 'error');
                }

                await sleep(2000 + Math.random() * 1500);
            }

            if (state.isRunning) {
                log(`${CONFIG.intervalMinutes} 分钟后自动下一轮`);
                startCountdown(CONFIG.intervalMinutes * 60);
            }
        }

        function startCountdown(seconds) {
            el.status.innerText = '等待再次唤醒...';
            el.stateText.innerText = '休眠中💤';
            let remaining = seconds;
            clearInterval(state.countdownId);
            state.countdownId = setInterval(() => {
                if (!state.isRunning) {
                    clearInterval(state.countdownId);
                    return;
                }
                if (remaining <= 0) {
                    clearInterval(state.countdownId);
                    runBoostCycle();
                    return;
                }
                const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                const s = (remaining % 60).toString().padStart(2, '0');
                el.nextRun.innerText = `${m}:${s}`;
                remaining--;
            }, 1000);
        }

        async function start() {
            state.isRunning = true;
            enableBackgroundKeepAlive();
            el.btn.innerText = '停止';
            el.btn.classList.add('stop');
            el.bvInput.disabled = true;

            parseManualVideos();
            if (state.videos.length === 0) {
                log('请输入正确的 BV 号', 'error');
                stop();
                return;
            }

            el.count.innerText = state.videos.length;
            log(`${state.videos.length} 个视频准备就绪💗`, 'success');
            runBoostCycle();
        }

        function stop() {
            state.isRunning = false;
            clearInterval(state.countdownId);
            if (el.frame) el.frame.src = 'about:blank';
            el.btn.innerText = '开始运行';
            el.btn.classList.remove('stop');
            el.bvInput.disabled = false;
            el.status.innerText = '已停止';
            el.stateText.innerText = '已停止';
            log('已停止', 'warn');
        }

        el.btn.addEventListener('click', () => {
            if (state.isRunning) {
                stop();
            } else {
                start();
            }
        });

        // 📥 點擊一鍵下載 manifest.json 和 content.js 兩個檔案
        el.downloadBtn.addEventListener('click', () => {
            const manifestContent = JSON.stringify({
                "manifest_version": 3,
                "name": "⭐️极禹刷啵 - B站打榜助手⭐️",
                "version": "2.0.0",
                "description": "极禹专属B站自动打榜助手（已修复防吞心跳版）",
                "host_permissions": ["https://*.bilibili.com/*"],
                "content_scripts": [{
                    "matches": ["https://www.bilibili.com/video/*"],
                    "js": ["content.js"],
                    "run_at": "document_end"
                }]
            }, null, 2);

            const scriptContent = `(function () {
    'use strict';
    const DEFAULT_CONFIG = {
        enabled: false,
        videos: ['BV1xx411c7mD'],
        currentIndex: 0,
        playDurationSec: 38,
        minDelaySec: 4,
        maxDelaySec: 8,
        muteAudio: true,
        cycleCount: 0
    };
    function loadConfig() {
        const stored = localStorage.getItem('JIYU_BOOST_CONFIG');
        if (stored) { try { return { ...DEFAULT_CONFIG, ...JSON.parse(stored) }; } catch (e) {} }
        return DEFAULT_CONFIG;
    }
    function saveConfig(cfg) { localStorage.setItem('JIYU_BOOST_CONFIG', JSON.stringify(cfg)); }
    let config = loadConfig();

    const style = document.createElement('style');
    style.innerHTML = \`
        #jiyu-float-panel {
            position: fixed; bottom: 30px; right: 30px; width: 320px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
            border: 3px solid #FFCCDD; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 121, 156, 0.3); z-index: 99999999;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #444; padding: 16px; box-sizing: border-box;
        }
        #jiyu-float-panel h3 { margin: 0 0 8px 0; color: #FF799C; font-size: 16px; font-weight: 900; }
        .jiyu-btn {
            width: 100%; padding: 10px; border: none; border-radius: 30px;
            background: linear-gradient(135deg, #FF799C, #FFA2BD); color: white;
            font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px;
        }
        .jiyu-btn.stop { background: linear-gradient(135deg, #FFB3D1, #FF7777); }
        .jiyu-textarea {
            width: 100%; height: 70px; border: 2px solid #FFE6EE; border-radius: 12px;
            padding: 8px; font-size: 12px; box-sizing: border-box; resize: none; outline: none;
            background: #FFF9FA; font-family: monospace;
        }
        .jiyu-status-line { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 6px; }
        .jiyu-highlight { color: #FF799C; font-weight: bold; }
        .jiyu-log { font-size: 11px; color: #888; margin-top: 8px; background: #FFFDFE; padding: 6px 8px; border-radius: 8px; border: 1px solid #FFE6EE; }
    \`;
    document.head.appendChild(style);

    const panel = document.createElement('div');
    panel.id = 'jiyu-float-panel';
    panel.innerHTML = \`
        <h3>💗 极禹刷啵助手 (修復版) 💗</h3>
        <textarea id=\"jiyu-bv-list\" class=\"jiyu-textarea\" placeholder=\"每行輸入一個BV號...\"></textarea>
        <div class=\"jiyu-status-line\">
            <span>當前: <span id=\"jiyu-cur-bv\" class=\"jiyu-highlight\">--</span></span>
            <span>心跳倒計時: <span id=\"jiyu-timer\" class=\"jiyu-highlight\">--:--</span></span>
        </div>
        <div class=\"jiyu-status-line\">
            <span>總輪次: <span id=\"jiyu-cycle\" class=\"jiyu-highlight\">0</span></span>
            <span>進度: <span id=\"jiyu-progress\" class=\"jiyu-highlight\">0/0</span></span>
        </div>
        <div id=\"jiyu-log-box\" class=\"jiyu-log\">準備就緒</div>
        <button id=\"jiyu-action-btn\" class=\"jiyu-btn\">開始全自動打榜</button>
    \`;
    document.body.appendChild(panel);

    const ui = {
        bvText: document.getElementById('jiyu-bv-list'),
        curBv: document.getElementById('jiyu-cur-bv'),
        timer: document.getElementById('jiyu-timer'),
        cycle: document.getElementById('jiyu-cycle'),
        progress: document.getElementById('jiyu-progress'),
        log: document.getElementById('jiyu-log-box'),
        btn: document.getElementById('jiyu-action-btn')
    };

    ui.bvText.value = config.videos.join('\\n');
    ui.cycle.innerText = config.cycleCount || 0;

    function setLog(msg) { if (ui.log) ui.log.innerText = msg; }
    function getPageBv() {
        const match = window.location.pathname.match(/\\/video\\/(BV1[0-9a-zA-Z]{9})/);
        return match ? match[1] : null;
    }

    function navigateNext() {
        if (!config.enabled || config.videos.length === 0) return;
        config.currentIndex++;
        if (config.currentIndex >= config.videos.length) {
            config.currentIndex = 0;
            config.cycleCount = (config.cycleCount || 0) + 1;
        }
        saveConfig(config);
        const nextBv = config.videos[config.currentIndex];
        const delay = Math.floor(Math.random() * 4) + 4;
        let wait = delay;
        const t = setInterval(() => {
            wait--;
            setLog(\`擬人化隨機延遲中: \${wait}s\`);
            if (wait <= 0) {
                clearInterval(t);
                window.location.href = \`https://www.bilibili.com/video/\${nextBv}\`;
            }
        }, 1000);
    }

    async function startDriver() {
        const curPageBv = getPageBv();
        if (!curPageBv) return;
        const targetBv = config.videos[config.currentIndex];
        if (targetBv && curPageBv !== targetBv) {
            window.location.href = \`https://www.bilibili.com/video/\${targetBv}\`;
            return;
        }
        setLog('等待官方播放器就緒...');
        let video = null;
        for (let i = 0; i < 30; i++) {
            video = document.querySelector('video');
            if (video && video.readyState >= 1) break;
            await new Promise(r => setTimeout(r, 500));
        }
        if (!video) { setTimeout(navigateNext, 4000); return; }
        if (config.muteAudio) { video.muted = true; video.volume = 0; }
        try { await video.play(); } catch (e) {}
        let remain = config.playDurationSec;
        const interval = setInterval(() => {
            if (!config.enabled) { clearInterval(interval); return; }
            remain--;
            ui.timer.innerText = \`\${remain}s\`;
            if (remain <= 0) {
                clearInterval(interval);
                setLog(\`✅ \${curPageBv} 心跳時長達標！\`);
                navigateNext();
            }
        }, 1000);
    }

    ui.btn.onclick = () => {
        if (config.enabled) {
            config.enabled = false; saveConfig(config);
            ui.btn.innerText = '開始全自動打榜'; ui.btn.classList.remove('stop');
            setLog('已停止');
        } else {
            const matches = ui.bvText.value.match(/BV1[0-9a-zA-Z]{9}/g);
            if (!matches || matches.length === 0) { alert('請輸入有效BV號'); return; }
            config.videos = Array.from(new Set(matches));
            config.enabled = true; config.currentIndex = 0; saveConfig(config);
            ui.btn.innerText = '停止打榜'; ui.btn.classList.add('stop');
            if (getPageBv() === config.videos[0]) { startDriver(); }
            else { window.location.href = \`https://www.bilibili.com/video/\${config.videos[0]}\`; }
        }
    };
    if (config.enabled) { ui.btn.innerText = '停止打榜'; ui.btn.classList.add('stop'); setTimeout(startDriver, 1500); }
})();`;

            function triggerDownload(filename, content, mime) {
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            }

            // 觸發下載 manifest.json
            triggerDownload('manifest.json', manifestContent, 'application/json');
            
            // 延遲 500ms 觸發下載 content.js
            setTimeout(() => {
                triggerDownload('content.js', scriptContent, 'text/javascript');
                log('📥 插件已下載！放進資料夾載入 Edge 即可', 'success');
                alert('🎉 manifest.json 與 content.js 已下載完成！\n\n請在電腦桌面新建資料夾，把這兩個檔案放進去，並在 Edge 的 edge://extensions/ 載入即可掛機！');
            }, 500);
        });

        log(`💞极禹刷啵⭐️#${currentSessionId} 已就绪`);
    </script>
