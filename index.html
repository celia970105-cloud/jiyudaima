<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️极禹刷啵⭐️</title>
    <style>
        /* 🎨 精準配色：#FFCCDD 與 #FF799C */
        :root {
            --primary-pink: #FF799C;
            --light-pink: #FFCCDD;
            --soft-white: rgba(255, 255, 255, 0.95);
            --star-color: #FFB3D1;
            --text-dark: #555555;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, "Microsoft JhengHei", sans-serif;
            background-color: var(--light-pink);
            background-image: linear-gradient(135deg, #FFCCDD 0%, #FFB3D1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ✨ 星光閃爍 */
        body::before {
            content: '★';
            position: fixed;
            top: 8%;
            left: 12%;
            color: white;
            font-size: 24px;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        body::after {
            content: '✧';
            position: fixed;
            bottom: 12%;
            right: 10%;
            color: white;
            font-size: 32px;
            opacity: 0.4;
            animation: twinkle 4s infinite ease-in-out reverse;
        }

        @keyframes twinkle {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.2) rotate(15deg);
                opacity: 0.7;
            }
        }

        .container {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(255, 121, 156, 0.25);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            border: 4px solid white;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            color: var(--primary-pink);
            margin-bottom: 5px;
            font-weight: 900;
            text-shadow: 1px 1px 0px white;
        }

        #mode-tag {
            text-align: center;
            color: #888;
            font-size: 11px;
            font-style: italic;
            background: rgba(255, 255, 255, 0.8);
            padding: 3px 12px;
            border-radius: 20px;
            display: block;
            margin: 0 auto 10px auto;
            width: fit-content;
            border: 1px solid #FFE6EE;
        }

        .card {
            background: white;
            border: 2px solid var(--light-pink);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(255, 204, 221, 0.2);
        }

        .multi-tip {
            background: #FFF0F4;
            border: 1px dashed var(--primary-pink);
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            color: #D6456D;
            line-height: 1.4;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-pink);
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 2px solid #FFE6EE;
            border-radius: 14px;
            font-size: 13px;
            background: #FFF9FA;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-pink);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(to right, #FF799C, #FF9EBA);
            box-shadow: 0 6px 20px rgba(255, 121, 156, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 121, 156, 0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.stop {
            background: linear-gradient(to right, #FFB3D1, #FF9999);
            box-shadow: 0 6px 15px rgba(255, 153, 153, 0.3);
        }

        .btn-download {
            background: linear-gradient(to right, #FFA2BD, #FF799C);
            font-size: 13px;
            padding: 11px;
            box-shadow: 0 4px 12px rgba(255, 121, 156, 0.25);
            margin-top: 4px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            padding: 8px 0;
            border-bottom: 1px dashed var(--light-pink);
        }

        .status-bar:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 500;
        }

        .status-value {
            font-weight: bold;
            color: var(--primary-pink);
        }

        #log-window {
            height: 130px;
            background: #FFFDFE;
            border-radius: 14px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-y: auto;
            border: 2px solid #FFE6EE;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 6px;
            border-bottom: 1px solid #FFF0F4;
            padding-bottom: 3px;
        }

        .log-time {
            color: #BBB;
            margin-right: 8px;
            font-size: 11px;
        }

        .log-warn {
            color: #FF799C;
            font-weight: bold;
        }

        .log-error {
            color: #FF4444;
        }

        .log-success {
            color: #FF799C;
            font-weight: bold;
        }

        .ext-guide-box {
            background: #FFF8FA;
            border: 1px solid #FFE6EE;
            border-radius: 14px;
            padding: 12px;
            font-size: 11px;
            color: #777;
            line-height: 1.6;
        }

        .ext-guide-box b {
            color: #FF799C;
        }

        /* 5 通道靜音並發驅動組件 */
        .hidden-channel {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            border: none;
        }
    </style>
</head>

<body>
    <!-- 5 個官方心跳播放器通道（同時並發） -->
    <iframe id="chan-1" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>
    <iframe id="chan-2" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>
    <iframe id="chan-3" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>
    <iframe id="chan-4" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>
    <iframe id="chan-5" class="hidden-channel" src="about:blank" allow="autoplay"></iframe>

    <div class="container">
        <div style="text-align: center;">
            <h1>💗极禹刷啵 💗</h1>
            <p id="mode-tag">EDGE Mode</p>
        </div>

        <div class="multi-tip"> 建立edge账号后，点击头像 新增无痕页面 每个页面登录不同的edge账号和b站号，最多3-5个避免ip风险！
        </div>

        <div id="manual-ui" class="card">
            <label for="bv-input">BV 号输入 (每行一个)</label>
            <textarea id="bv-input" placeholder="BV1xx...&#10;BV2xx...&#10;..."></textarea>
        </div>

        <button id="action-btn" class="btn">开始运行</button>

        <div class="card">
            <div class="status-bar">
                <span class="status-label">待刷视频: <span id="video-count" class="status-value">0</span></span>
                <span class="status-label">下次循环: <span id="next-run" class="status-value">--:--</span></span>
            </div>
            <div class="status-bar">
                <span class="status-label">累计发送请求次数: <span id="success-count" class="status-value">0</span></span>
                <span id="status-text" class="status-value" style="font-size: 12px;"></span>
            </div>
            <div style="font-size: 11px; text-align: right; color: #999; margin-top: 5px;">
                当前标签: <span id="session-tag" class="status-value" style="font-size: 11px;">⭐</span> |
                当前状态: <span id="current-state-text">准备就绪</span>
            </div>
        </div>

        <!-- 電腦 Edge 外掛插件包下載 -->
        <div class="ext-guide-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <b>🖥️ 電腦 Edge 外掛插件包（修復版）</b>
            </div>
            <div>1️⃣ 點擊下方按鈕，自動下載 <code>manifest.json</code> 與 <code>content.js</code></div>
            <div>2️⃣ 桌面新建資料夾，把這兩個檔案放進去</div>
            <div>3️⃣ Edge 打開 <code>edge://extensions/</code> 開啟【開發者模式】</div>
            <div>4️⃣ 點擊【載入解壓縮的擴充功能】選擇該資料夾即可！</div>
            <button id="download-ext-btn" class="btn btn-download" type="button">📥 一鍵下載 Edge 打榜外掛包 (雙檔案)</button>
        </div>

        <div>
            <div id="log-window"></div>
        </div>
    </div>

    <script>
        if (!window.location.hash.includes('session=')) {
            const uniqueSession = Date.now().toString().slice(-6);
            window.location.hash = 'session=' + uniqueSession;
        }
        const currentSessionId = window.location.hash.split('session=')[1] || "⭐";

        const CONFIG = {
            playDuration: 38,     // 每個視頻跑滿 38 秒（覆蓋 B 站有效心跳）
            intervalMinutes: 5,   // 一大輪全部刷完後的冷卻分鐘數
            maxChannels: 5        // 🔥 升級為 5 通道同時並發（速度翻 5 倍）
        };

        let state = {
            isRunning: false,
            videos: [],
            countdownId: null,
            totalSent: 0,
            wakeLock: null
        };

        const el = {
            btn: document.getElementById('action-btn'),
            manualUi: document.getElementById('manual-ui'),
            bvInput: document.getElementById('bv-input'),
            log: document.getElementById('log-window'),
            count: document.getElementById('video-count'),
            nextRun: document.getElementById('next-run'),
            success: document.getElementById('success-count'),
            status: document.getElementById('status-text'),
            modeTag: document.getElementById('mode-tag'),
            stateText: document.getElementById('current-state-text'),
            sessionTag: document.getElementById('session-tag'),
            channels: [
                document.getElementById('chan-1'),
                document.getElementById('chan-2'),
                document.getElementById('chan-3'),
                document.getElementById('chan-4'),
                document.getElementById('chan-5')
            ],
            downloadBtn: document.getElementById('download-ext-btn')
        };

        el.sessionTag.innerText = "⭐#" + currentSessionId;

        // 本地記錄 BV 號
        const savedBvs = localStorage.getItem('JIYU_BV_SAVED');
        if (savedBvs) {
            el.bvInput.value = savedBvs;
        }

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            let colorClass = '';
            if (type === 'warn') colorClass = 'log-warn';
            if (type === 'error') colorClass = 'log-error';
            if (type === 'success') colorClass = 'log-success';
            entry.innerHTML = `<span class="log-time">${time}</span><span class="${colorClass}">${msg}</span>`;
            el.log.appendChild(entry);
            el.log.scrollTop = el.log.scrollHeight;
        }

        // 後台防休眠保活機制
        let audioCtx = null;
        function enableBackgroundKeepAlive() {
            try {
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').then(lock => {
                        state.wakeLock = lock;
                    }).catch(() => {});
                }
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        audioCtx = new AudioContext();
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        gain.gain.value = 0.0001;
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                    }
                }
            } catch (e) {}
        }

        function parseManualVideos() {
            const text = el.bvInput.value;
            if (!text) return;

            const bvRegex = /BV[a-zA-Z0-9]{10}/gi;
            const matchedBvs = text.match(bvRegex);

            if (!matchedBvs) {
                state.videos = [];
                return;
            }

            const uniqueBvs = [...new Set(matchedBvs.map(bv => {
                return 'BV' + bv.slice(2);
            }))];

            state.videos = uniqueBvs.map(bv => ({
                bvid: bv,
                title: bv
            }));

            localStorage.setItem('JIYU_BV_SAVED', text);
        }

        function sleep(ms) {
            return new Promise(resolve => {
                const start = Date.now();
                const timer = setInterval(() => {
                    if (!state.isRunning || Date.now() - start >= ms) {
                        clearInterval(timer);
                        resolve();
                    }
                }, 100);
            });
        }

        // 核心：5 通道並發打榜主邏輯
        async function runBoostCycle() {
            if (!state.isRunning) return;
            log('🚀 开始新一轮（5通道并发打榜）...', 'success');
            el.status.innerText = '執行中...';
            el.stateText.innerText = '正在运行';

            // 將所有視頻按 5 個一組打包，並發運行
            for (let i = 0; i < state.videos.length; i += CONFIG.maxChannels) {
                if (!state.isRunning) break;

                const currentBatch = state.videos.slice(i, i + CONFIG.maxChannels);
                const batchBvs = currentBatch.map(v => v.bvid);

                log(`▶️ 5通道並發: ${batchBvs.join(' | ')}`);

                // 同時啟動 5 個通道載入官方播放器上報心跳
                currentBatch.forEach((v, idx) => {
                    const chan = el.channels[idx];
                    if (chan) {
                        chan.src = `https://player.bilibili.com/player.html?bvid=${v.bvid}&autoplay=1&muted=1&page=1`;
                    }

                    const params = new URLSearchParams({
                        bvid: v.bvid,
                        part: '1',
                        jsonp: 'jsonp',
                        type: '1',
                        subtype: '0'
                    });
                    fetch('https://api.bilibili.com/x/click-interface/click/web/h5', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params
                    }).catch(() => {});
                });

                // 5 個視頻同時倒計時 38 秒
                let remain = CONFIG.playDuration;
                while (remain > 0 && state.isRunning) {
                    el.status.innerText = `心跳累計: ${remain}s (同時刷${currentBatch.length}個)`;
                    await sleep(1000);
                    remain--;
                }

                if (!state.isRunning) break;

                // 本組 5 個視頻全部達標
                currentBatch.forEach(v => {
                    state.totalSent++;
                    log(` ${v.bvid} 播放成功 ✅`);
                });
                el.success.innerText = state.totalSent;

                // 擬人化間歇 3~5 秒換下一批
                await sleep(3000 + Math.random() * 2000);
            }

            // 清空當前播放通道
            el.channels.forEach(ch => { if (ch) ch.src = 'about:blank'; });

            if (state.isRunning) {
                log(`${CONFIG.intervalMinutes} 分钟后自动下一轮`);
                startCountdown(CONFIG.intervalMinutes * 60);
            }
        }

        function startCountdown(seconds) {
            el.status.innerText = '等待再次唤醒...';
            el.stateText.innerText = '休眠中💤';
            let remaining = seconds;
            clearInterval(state.countdownId);
            state.countdownId = setInterval(() => {
                if (!state.isRunning) {
                    clearInterval(state.countdownId);
                    return;
                }
                if (remaining <= 0) {
                    clearInterval(state.countdownId);
                    runBoostCycle();
                    return;
                }
                const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                const s = (remaining % 60).toString().padStart(2, '0');
                el.nextRun.innerText = `${m}:${s}`;
                remaining--;
            }, 1000);
        }

        async function start() {
            state.isRunning = true;
            enableBackgroundKeepAlive();
            el.btn.innerText = '停止';
            el.btn.classList.add('stop');
            el.bvInput.disabled = true;

            parseManualVideos();
            if (state.videos.length === 0) {
                log('请输入正确的 BV 号', 'error');
                stop();
                return;
            }

            el.count.innerText = state.videos.length;
            log(`${state.videos.length} 个视频准备就绪💗（5 通道并发啟動）`, 'success');
            runBoostCycle();
        }

        function stop() {
            state.isRunning = false;
            clearInterval(state.countdownId);
            el.channels.forEach(ch => { if (ch) ch.src = 'about:blank'; });
            el.btn.innerText = '开始运行';
            el.btn.classList.remove('stop');
            el.bvInput.disabled = false;
            el.status.innerText = '已停止';
            el.stateText.innerText = '已停止';
            log('已停止', 'warn');
        }

        el.btn.addEventListener('click', () => {
            if (state.isRunning) {
                stop();
            } else {
                start();
            }
        });

        // 外掛下載功能
        el.downloadBtn.addEventListener('click', () => {
            const manifestContent = JSON.stringify({
                "manifest_version": 3,
                "name": "⭐️极禹刷啵 - B站打榜助手⭐️",
                "version": "2.0.0",
                "description": "极禹专属B站自动打榜助手（已修复防吞心跳版）",
                "host_permissions": ["https://*.bilibili.com/*"],
                "content_scripts": [{
                    "matches": ["https://www.bilibili.com/video/*"],
                    "js": ["content.js"],
                    "run_at": "document_end"
                }]
            }, null, 2);

            const scriptContent = `(function () {
    'use strict';
    const DEFAULT_CONFIG = { enabled: false, videos: ['BV1xx411c7mD'], currentIndex: 0, playDurationSec: 38, minDelaySec: 4, maxDelaySec: 8, muteAudio: true, cycleCount: 0 };
    function loadConfig() { const stored = localStorage.getItem('JIYU_BOOST_CONFIG'); return stored ? JSON.parse(stored) : DEFAULT_CONFIG; }
    function saveConfig(cfg) { localStorage.setItem('JIYU_BOOST_CONFIG', JSON.stringify(cfg)); }
    let config = loadConfig();
    const style = document.createElement('style');
    style.innerHTML = '#jiyu-float-panel{position:fixed;bottom:30px;right:30px;width:320px;background:rgba(255,255,255,0.95);border:3px solid #FFCCDD;border-radius:20px;padding:16px;z-index:99999999;font-family:sans-serif;}.jiyu-btn{width:100%;padding:10px;border:none;border-radius:30px;background:linear-gradient(135deg,#FF799C,#FFA2BD);color:#fff;font-weight:bold;cursor:pointer;margin-top:8px;}';
    document.head.appendChild(style);
    const panel = document.createElement('div');
    panel.id = 'jiyu-float-panel';
    panel.innerHTML = '<h3>💗 极禹刷啵助手 (修復版) 💗</h3><textarea id="jiyu-bv-list" style="width:100%;height:70px;border-radius:10px;border:2px solid #FFE6EE;padding:6px;font-size:12px;" placeholder="每行輸入一個BV號..."></textarea><div id="jiyu-log" style="font-size:11px;color:#888;margin:6px 0;">準備就緒</div><button id="jiyu-btn" class="jiyu-btn">開始全自動打榜</button>';
    document.body.appendChild(panel);
    const elText = document.getElementById('jiyu-bv-list');
    const elLog = document.getElementById('jiyu-log');
    const elBtn = document.getElementById('jiyu-btn');
    elText.value = config.videos.join('\\n');
    elBtn.onclick = () => {
        if(config.enabled){ config.enabled = false; saveConfig(config); elBtn.innerText = '開始全自動打榜'; elLog.innerText = '已停止'; }
        else{ const m = elText.value.match(/BV1[0-9a-zA-Z]{9}/g); if(!m) return alert('請輸入有效BV號'); config.videos = [...new Set(m)]; config.enabled = true; config.currentIndex = 0; saveConfig(config); elBtn.innerText = '停止打榜'; window.location.href = 'https://www.bilibili.com/video/' + config.videos[0]; }
    };
    if(config.enabled){
        elBtn.innerText = '停止打榜';
        setTimeout(async () => {
            let v = document.querySelector('video');
            for(let i=0; i<30 && !v; i++){ await new Promise(r => setTimeout(r,500)); v = document.querySelector('video'); }
            if(v){ v.muted = true; try{ await v.play(); }catch(e){} }
            let rem = config.playDurationSec;
            const itv = setInterval(() => {
                if(!config.enabled){ clearInterval(itv); return; }
                rem--; elLog.innerText = '心跳倒計時: ' + rem + 's';
                if(rem <= 0){
                    clearInterval(itv);
                    config.currentIndex = (config.currentIndex + 1) % config.videos.length;
                    saveConfig(config);
                    window.location.href = 'https://www.bilibili.com/video/' + config.videos[config.currentIndex];
                }
            }, 1000);
        }, 2000);
    }
})();`;

            function triggerDownload(filename, content, mime) {
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            }

            triggerDownload('manifest.json', manifestContent, 'application/json');
            setTimeout(() => {
                triggerDownload('content.js', scriptContent, 'text/javascript');
                alert('🎉 外掛雙檔案已下載！放進資料夾載入 Edge 即可！');
            }, 500);
        });

        log(`💞极禹刷啵⭐️#${currentSessionId} 已就绪`);
    </script>
</body>

</html></html></html></html>
