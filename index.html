<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️极禹刷啵⭐️</title>
    <style>
        /* 🎨 精准配色：#FFCCDD 与 #FF799C */
        :root {
            --primary-pink: #FF799C;
            --light-pink: #FFCCDD;
            --soft-white: rgba(255, 255, 255, 0.95);
            --star-color: #FFB3D1;
            --text-dark: #555555;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: var(--light-pink);
            background-image: linear-gradient(135deg, #FFCCDD 0%, #FFB3D1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '★';
            position: fixed;
            top: 8%;
            left: 12%;
            color: white;
            font-size: 24px;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        body::after {
            content: '✧';
            position: fixed;
            bottom: 12%;
            right: 10%;
            color: white;
            font-size: 32px;
            opacity: 0.4;
            animation: twinkle 4s infinite ease-in-out reverse;
        }

        @keyframes twinkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.2) rotate(15deg); opacity: 0.7; }
        }

        .container {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(255, 121, 156, 0.25);
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
            border: 4px solid white;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            color: var(--primary-pink);
            margin-bottom: 5px;
            font-weight: 900;
            text-shadow: 1px 1px 0px white;
        }

        #mode-tag {
            text-align: center;
            color: #888;
            font-size: 11px;
            font-style: italic;
            background: rgba(255, 255, 255, 0.8);
            padding: 3px 12px;
            border-radius: 20px;
            display: block;
            margin: 0 auto 10px auto;
            width: fit-content;
            border: 1px solid #FFE6EE;
        }

        .card {
            background: white;
            border: 2px solid var(--light-pink);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(255, 204, 221, 0.2);
        }

        .multi-tip {
            background: #FFF0F4;
            border: 1px dashed var(--primary-pink);
            border-radius: 12px;
            padding: 10px;
            font-size: 12px;
            color: #D6456D;
            line-height: 1.4;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-pink);
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 2px solid #FFE6EE;
            border-radius: 14px;
            font-size: 13px;
            background: #FFF9FA;
            outline: none;
            resize: none;
            font-family: 'Courier New', monospace;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-pink);
            background: white;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(to right, #FF799C, #FF9EBA);
            box-shadow: 0 6px 20px rgba(255, 121, 156, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 121, 156, 0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.stop {
            background: linear-gradient(to right, #FFB3D1, #FF9999);
            box-shadow: 0 6px 15px rgba(255, 153, 153, 0.3);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            padding: 10px 0;
            border-bottom: 1px dashed var(--light-pink);
        }

        .status-bar:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 500;
        }

        .status-value {
            font-weight: bold;
            color: var(--primary-pink);
        }

        #log-window {
            height: 150px;
            background: #FFFDFE;
            border-radius: 14px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-y: auto;
            border: 2px solid #FFE6EE;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 6px;
            border-bottom: 1px solid #FFF0F4;
            padding-bottom: 3px;
        }

        .log-time {
            color: #BBB;
            margin-right: 8px;
            font-size: 11px;
        }

        .log-warn {
            color: #FF799C;
            font-weight: bold;
        }

        .log-error {
            color: #FF4444;
        }

        .log-success {
            color: #FF799C;
            font-weight: bold;
        }

        .ext-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .ext-sub-btn {
            flex: 1;
            padding: 9px 6px;
            border: 1px solid var(--primary-pink);
            background: #FFF0F4;
            color: #D6456D;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .ext-sub-btn:hover {
            background: var(--primary-pink);
            color: white;
        }

        .ext-guide {
            font-size: 11px;
            color: #888;
            line-height: 1.6;
            margin-top: 10px;
            background: #FFF9FA;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #FFE6EE;
        }
    </style>
</head>

<body>
    <div class="container">
        <div style="text-align: center;">
            <h1>💗极禹刷啵 💗</h1>
            <p id="mode-tag">EDGE & Safari Mode</p>
        </div>

        <div class="multi-tip"> 建立edge账号后，点击头像 新增无痕页面 每个页面登录不同的edge账号和b站号，最多3-5个避免ip风险！
        </div>

        <div id="manual-ui" class="card">
            <label for="bv-input">BV 号输入 (每行一个)</label>
            <textarea id="bv-input" placeholder="BV1xx...&#10;BV2xx...&#10;..."></textarea>
        </div>

        <button id="action-btn" class="btn">开始运行</button>

        <div class="card">
            <div class="status-bar">
                <span class="status-label">待刷视频: <span id="video-count" class="status-value">0</span></span>
                <span class="status-label">下次循环: <span id="next-run" class="status-value">--:--</span></span>
            </div>
            <div class="status-bar">
                <span class="status-label">累计有效上报: <span id="success-count" class="status-value">0</span></span>
                <span id="status-text" class="status-value" style="font-size: 12px;"></span>
            </div>
            <div style="font-size: 11px; text-align: right; color: #999; margin-top: 5px;">
                当前标签: <span id="session-tag" class="status-value" style="font-size: 11px;">⭐</span> |
                当前状态: <span id="current-state-text">准备就绪</span>
            </div>
        </div>

        <div>
            <div id="log-window"></div>
        </div>

        <!-- 🖥️ 电脑 Edge 扩展下载专区 -->
        <div class="card" style="padding: 14px 16px;">
            <label style="margin-bottom: 4px;">🖥️ Edge 浏览器原生扩展（最强推荐）</label>
            <div style="font-size: 11px; color: #888;">带真实账号 Cookie 运行，播放量计入率最高：</div>
            <div class="ext-btn-row">
                <button type="button" id="dl-manifest" class="ext-sub-btn">📥 下载 manifest.json</button>
                <button type="button" id="dl-content" class="ext-sub-btn">📥 下载 content.js</button>
            </div>
            <div class="ext-guide">
                <b>安装 4 步骤指南：</b><br>
                1️⃣ 桌面新建文件夹，把下载的两个文件放进文件夹<br>
                2️⃣ 点开 Edge 地址栏输入 <code>edge://extensions/</code> 回车<br>
                3️⃣ 开启页面左下角的【开发者模式】开关<br>
                4️⃣ 点击上方“加载解压缩的扩展”，选择桌面文件夹即可！
            </div>
        </div>
    </div>

    <script>
        if (!window.location.hash.includes('session=')) {
            const uniqueSession = Date.now().toString().slice(-6);
            window.location.hash = 'session=' + uniqueSession;
        }
        const currentSessionId = window.location.hash.split('session=')[1] || "⭐";

        const CONFIG = { intervalMinutes: 5.5 };

        // 🌟 B 站官方标准 Base58 转换算法 (修复 null 缺陷)
        const TABLE = 'fZodR9XQDSUm21yCkr6zBqiveYah8bt4xsWpHnJE7jL5VG3guMTKNPAwxF';
        const TR = {};
        for (let i = 0; i < 58; i++) {
            TR[TABLE[i]] = BigInt(i);
        }
        const S = [11, 10, 3, 8, 4, 6];
        const XOR = 177451812n;
        const ADD = 8728348608n;

        function bvToAid(bv) {
            try {
                if (!bv || bv.length < 12) return null;
                let r = 0n;
                for (let i = 0; i < 6; i++) {
                    const idx = TR[bv[S[i]]];
                    if (idx === undefined) return null;
                    r += idx * (58n ** BigInt(i));
                }
                const aid = (r - ADD) ^ XOR;
                return aid > 0n ? aid.toString() : null;
            } catch (e) {
                return null;
            }
        }

        // 📱 免代理 JSONP 直连获取官方真实 CID (突破 CORS 与代理风控)
        function fetchCidViaJsonp(bvid, timeout = 4000) {
            return new Promise((resolve) => {
                const cbName = 'bili_cb_' + Math.random().toString(36).slice(2);
                const script = document.createElement('script');
                let timer = null;

                window[cbName] = (data) => {
                    clearTimeout(timer);
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    if (data && data.code === 0 && data.data) {
                        resolve({
                            aid: data.data.aid ? data.data.aid.toString() : null,
                            cid: data.data.cid ? data.data.cid.toString() : null,
                            title: data.data.title || bvid
                        });
                    } else {
                        resolve(null);
                    }
                };

                script.src = `https://api.bilibili.com/x/web-interface/view?bvid=${bvid}&jsonp=jsonp&callback=${cbName}`;
                script.onerror = () => {
                    clearTimeout(timer);
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(null);
                };

                timer = setTimeout(() => {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(null);
                }, timeout);

                document.body.appendChild(script);
            });
        }

        // 📱 Safari 锁屏后台保活音频
        let audioContext = null;
        let silentOscillator = null;

        function startSilentAudio() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!audioContext) audioContext = new AudioCtx();
                if (audioContext.state === 'suspended') audioContext.resume();
                silentOscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                gainNode.gain.value = 0.00001;
                silentOscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                silentOscillator.start();
                log('🎧 锁屏后台保活已激活', 'info');
            } catch (e) {}
        }

        function stopSilentAudio() {
            try {
                if (silentOscillator) {
                    silentOscillator.stop();
                    silentOscillator.disconnect();
                    silentOscillator = null;
                }
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.suspend();
                }
            } catch (e) {}
        }

        let state = {
            isRunning: false,
            videos: [],
            countdownId: null,
            totalSent: 0
        };

        const el = {
            btn: document.getElementById('action-btn'),
            manualUi: document.getElementById('manual-ui'),
            bvInput: document.getElementById('bv-input'),
            log: document.getElementById('log-window'),
            count: document.getElementById('video-count'),
            nextRun: document.getElementById('next-run'),
            success: document.getElementById('success-count'),
            status: document.getElementById('status-text'),
            modeTag: document.getElementById('mode-tag'),
            stateText: document.getElementById('current-state-text'),
            sessionTag: document.getElementById('session-tag'),
            dlManifest: document.getElementById('dl-manifest'),
            dlContent: document.getElementById('dl-content')
        };

        el.sessionTag.innerText = "⭐#" + currentSessionId;

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            let colorClass = '';
            if (type === 'warn') colorClass = 'log-warn';
            if (type === 'error') colorClass = 'log-error';
            if (type === 'success') colorClass = 'log-success';
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="${colorClass}">${msg}</span>`;
            el.log.appendChild(entry);
            el.log.scrollTop = el.log.scrollHeight;
        }

        function parseManualVideos() {
            const text = el.bvInput.value;
            if (!text) return;
            const bvRegex = /BV[a-zA-Z0-9]{10}/gi;
            const matchedBvs = text.match(bvRegex);
            if (!matchedBvs) {
                state.videos = [];
                return;
            }
            const uniqueBvs = [...new Set(matchedBvs.map(bv => 'BV' + bv.slice(2)))];
            state.videos = uniqueBvs.map(bv => ({
                bvid: bv,
                title: bv,
                aid: bvToAid(bv), // 标准还原真实 AID
                cid: null
            }));
        }

        async function enrichVideoData() {
            log(`🔍 正在校验视频真实凭据 (${state.videos.length} 个)...`, 'info');
            el.status.innerText = '正在校验参数';
            el.stateText.innerText = '校验中';

            for (let v of state.videos) {
                if (!state.isRunning) break;

                // 优先通过免代理 JSONP 直连拿真实 cid 与 aid
                const jsonpData = await fetchCidViaJsonp(v.bvid);
                if (jsonpData && jsonpData.cid) {
                    v.aid = jsonpData.aid || v.aid;
                    v.cid = jsonpData.cid;
                    v.title = jsonpData.title || v.bvid;
                    log(`✅ ${v.bvid} 直连成功: AID=${v.aid} | CID=${v.cid}`, 'success');
                } else {
                    // 若直连被拦截，使用标准数学 AID 保证基础凭证不为 null
                    log(`✨ ${v.bvid} 基础凭证就绪: AID=${v.aid || '已转换'}`, 'info');
                }
                await new Promise(r => setTimeout(r, 400));
            }

            el.count.innerText = state.videos.length;
            log(`💗 凭证核验完成，开始发送播放请求！`, 'success');
        }

        async function runBoostCycle() {
            if (!state.isRunning) return;
            log('🚀 开始新一轮播放上报...', 'success');
            el.status.innerText = '正在上报...';
            el.stateText.innerText = '正在运行';

            for (let v of state.videos) {
                if (!state.isRunning) break;

                try {
                    // 构造具备完整 aid、cid、bvid 的严谨上报参数
                    const payload = {
                        bvid: v.bvid,
                        part: '1',
                        jsonp: 'jsonp',
                        type: '1',
                        sub_type: '0',
                        stime: Math.floor(Date.now() / 1000)
                    };

                    if (v.aid) payload.aid = v.aid;
                    if (v.cid) payload.cid = v.cid;

                    const params = new URLSearchParams(payload);

                    await fetch('https://api.bilibili.com/x/click-interface/click/web/h5', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params
                    });

                    state.totalSent++;
                    el.success.innerText = state.totalSent;
                    const showName = v.title && v.title !== v.bvid ? v.title.substring(0, 8) + '...' : v.bvid;
                    log(`[√] ${showName} 播放凭据已递交 ✅`, 'success');
                } catch (e) {
                    log(`❌ ${v.bvid} 请求异常`, 'error');
                }

                await new Promise(r => setTimeout(r, 1500 + Math.random() * 1000));
            }

            if (state.isRunning) {
                log(`💤 本轮完成，休眠 ${CONFIG.intervalMinutes} 分钟避开风控`, 'info');
                startCountdown(CONFIG.intervalMinutes * 60);
            }
        }

        function startCountdown(seconds) {
            el.status.innerText = '等待下一轮...';
            el.stateText.innerText = '休眠中💤';
            let remaining = seconds;
            clearInterval(state.countdownId);
            state.countdownId = setInterval(() => {
                if (!state.isRunning) {
                    clearInterval(state.countdownId);
                    return;
                }
                if (remaining <= 0) {
                    clearInterval(state.countdownId);
                    runBoostCycle();
                    return;
                }
                const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                const s = (remaining % 60).toString().padStart(2, '0');
                el.nextRun.innerText = `${m}:${s}`;
                remaining--;
            }, 1000);
        }

        async function start() {
            state.isRunning = true;
            el.btn.innerText = '停止运行';
            el.btn.classList.add('stop');
            el.bvInput.disabled = true;

            startSilentAudio();
            parseManualVideos();

            if (state.videos.length === 0) {
                log('❌ 请输入正确的 BV 号', 'error');
                stop();
                return;
            }

            el.count.innerText = state.videos.length;
            log(`💗 已装载 ${state.videos.length} 个视频，正在获取 CID...`, 'info');

            await enrichVideoData();
            if (state.isRunning) {
                runBoostCycle();
            }
        }

        function stop() {
            state.isRunning = false;
            clearInterval(state.countdownId);
            stopSilentAudio();
            el.btn.innerText = '开始运行';
            el.btn.classList.remove('stop');
            el.bvInput.disabled = false;
            el.status.innerText = '已停止';
            el.stateText.innerText = '已停止';
            log('任务已停止', 'warn');
        }

        el.btn.addEventListener('click', () => {
            if (state.isRunning) {
                stop();
            } else {
                start();
            }
        });

        // 📥 电脑 Edge 扩展文件下载
        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log(`📁 已下载扩展文件：${filename}`, 'success');
        }

        const MANIFEST_CONTENT = JSON.stringify({
            "manifest_version": 3,
            "name": "极禹刷啵 - Edge原生助手",
            "version": "1.0.0",
            "description": "极禹视频播放与心跳原生助手，在B站原生环境运行",
            "content_scripts": [
                {
                    "matches": ["*://*.bilibili.com/*"],
                    "js": ["content.js"],
                    "run_at": "document_end"
                }
            ],
            "permissions": ["storage"]
        }, null, 4);

        const CONTENT_JS_CONTENT = `// 极禹刷啵 Edge 扩展原生运行脚本
console.log('[极禹刷啵] Edge 原生助手已注入 B 站环境');

const floatCard = document.createElement('div');
floatCard.id = 'jiyu-edge-panel';
floatCard.innerHTML = \`
    <div style="position:fixed;bottom:20px;right:20px;z-index:999999;background:rgba(255,255,255,0.95);border:2px solid #FF799C;border-radius:16px;padding:12px 16px;box-shadow:0 8px 24px rgba(255,121,156,0.3);font-family:sans-serif;color:#555;font-size:12px;">
        <div style="font-weight:bold;color:#FF799C;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
            <span>💗 极禹刷啵 Edge助手</span>
            <span id="jiyu-mini-close" style="cursor:pointer;color:#999;">✕</span>
        </div>
        <div style="font-size:11px;color:#888;margin-bottom:8px;">原生登录态运行中</div>
        <button id="jiyu-quick-click" style="width:100%;padding:6px;border:none;border-radius:20px;background:linear-gradient(to right, #FF799C, #FF9EBA);color:white;font-weight:bold;cursor:pointer;">
            发送当前视频有效心跳
        </button>
        <div id="jiyu-panel-msg" style="margin-top:6px;font-size:10px;color:#FF799C;"></div>
    </div>
\`;
document.body.appendChild(floatCard);

document.getElementById('jiyu-mini-close').onclick = () => {
    floatCard.style.display = 'none';
};

document.getElementById('jiyu-quick-click').onclick = async () => {
    const msg = document.getElementById('jiyu-panel-msg');
    msg.innerText = '正在发送原生心跳...';
    try {
        const bvid = window.location.pathname.split('/video/')[1]?.split('/')[0] || '';
        const aid = window.__INITIAL_STATE__?.aid || '';
        const cid = window.__INITIAL_STATE__?.cid || '';
        
        const params = new URLSearchParams({
            aid: aid,
            cid: cid,
            bvid: bvid,
            part: '1',
            type: '1',
            sub_type: '0'
        });
        
        await fetch('https://api.bilibili.com/x/click-interface/click/web/h5', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        });
        msg.innerText = '✅ 原生心跳发送成功！';
    } catch(e) {
        msg.innerText = '❌ 发送异常：' + e.message;
    }
};
`;
