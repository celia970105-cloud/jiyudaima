<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>⭐️极禹刷啵⭐️</title>
    <style>
        :root {
            --primary-pink: #FF799C;
            --light-pink: #FFCCDD;
            --soft-white: rgba(255, 255, 255, 0.96);
            --text-dark: #444444;
            --border-radius: 24px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", sans-serif;
            background-color: var(--light-pink);
            background-image: linear-gradient(135deg, #FFCCDD 0%, #FFB3D1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-dark);
            padding: 16px 12px;
        }
        .container {
            background: var(--soft-white);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 440px;
            padding: 22px 18px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(255, 121, 156, 0.25);
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 4px solid white;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            color: var(--primary-pink);
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #mode-tag {
            text-align: center;
            color: #888;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 14px;
            border-radius: 20px;
            display: block;
            margin: 4px auto 0 auto;
            width: fit-content;
            border: 1px solid #FFE6EE;
        }
        .multi-tip {
            background: #FFF0F4;
            border: 1px dashed var(--primary-pink);
            border-radius: 14px;
            padding: 12px;
            font-size: 12px;
            color: #D6456D;
            line-height: 1.5;
        }
        .card {
            background: white;
            border: 2px solid var(--light-pink);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(255, 204, 221, 0.15);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-pink);
            font-size: 13px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px solid #FFE6EE;
            border-radius: 14px;
            font-size: 13px;
            background: #FFF9FA;
            outline: none;
            resize: none;
            font-family: monospace;
        }
        textarea:focus { border-color: var(--primary-pink); background: white; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: linear-gradient(to right, #FF799C, #FF9EBA);
            box-shadow: 0 6px 20px rgba(255, 121, 156, 0.35);
        }
        .player-wrapper {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .playlist-header {
            font-weight: bold;
            font-size: 13px;
            color: var(--primary-pink);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .playlist-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }
        .playlist-item {
            padding: 9px 12px;
            border: 1px solid #FFE6EE;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: #FFFDFC;
        }
        .playlist-item.active {
            background: #FFF0F4;
            border-color: var(--primary-pink);
            color: var(--primary-pink);
            font-weight: bold;
        }
        .open-link {
            display: inline-block;
            text-align: center;
            width: 100%;
            padding: 10px;
            border-radius: 50px;
            background: #FFF0F4;
            color: var(--primary-pink);
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            border: 1px solid #FFCCD9;
        }
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
            background: #FFF7FA;
            border: 1px solid #FFE4ED;
            border-radius: 14px;
            padding: 10px 8px;
            text-align: center;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #FFEBF2;
            border-radius: 10px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 1px 3px rgba(255, 121, 156, 0.08);
        }
        .stat-name {
            font-size: 10px;
            color: #888;
        }
        .stat-val {
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        .stat-val.pink {
            color: var(--primary-pink);
        }
        .dur-btn, .spd-btn {
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #FFCCD9;
            background: #FFF0F4;
            color: #D6456D;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dur-btn.active, .spd-btn.active {
            background: var(--primary-pink);
            color: white;
            border-color: var(--primary-pink);
            box-shadow: 0 2px 6px rgba(255, 121, 156, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <h1>⭐️极禹刷啵⭐️</h1>
            <p id="mode-tag">EDGE & Safari 兼容版</p>
        </div>

        <div class="multi-tip">
            ✨ <strong>官方播放器已就绪</strong>：采用防盗链隔离技术，已解决移动端与外链失效问题。点击播放即可直接观赏，也可一键前往 B 站主站三连应援！
        </div>

        <div class="card">
            <label for="bv-input">BV 号输入 (支持多个，每行一个)</label>
            <textarea id="bv-input" placeholder="BV1xx..."></textarea>
            <button id="load-btn" class="btn" style="margin-top: 10px;">更新播放列表</button>
        </div>

        <!-- Short Video Reel Mode & Speed Controller -->
        <div class="card" id="reel-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-weight: 900; font-size: 13px; color: var(--primary-pink); display: flex; align-items: center; gap: 4px;">
                    ⚡ 🎬 短影音自動刷啵模式
                </span>
                <button id="toggle-auto-btn" style="padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; border: 1px solid #A7F3D0; background: #ECFDF5; color: #059669;">
                    ● 自動輪播中
                </button>
            </div>

            <!-- Duration Selector -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px;">
                <span style="color: #666; font-size: 11px;">⏱️ 切換間隔：</span>
                <div style="display: flex; gap: 4px;" id="duration-btns">
                    <button class="dur-btn" data-sec="15">15秒</button>
                    <button class="dur-btn active" data-sec="30">30秒</button>
                    <button class="dur-btn" data-sec="45">45秒</button>
                    <button class="dur-btn" data-sec="60">60秒</button>
                </div>
            </div>

            <!-- Playback Speed Selector -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px;">
                <span style="color: #666; font-size: 11px;">⚡ 播放倍速：</span>
                <div style="display: flex; gap: 4px;" id="speed-btns">
                    <button class="spd-btn" data-spd="1.0">1.0x</button>
                    <button class="spd-btn" data-spd="1.25">1.25x</button>
                    <button class="spd-btn" data-spd="1.5">1.5x</button>
                    <button class="spd-btn active" data-spd="2.0">2.0x 推薦</button>
                    <button class="spd-btn" data-spd="3.0">3.0x 極速</button>
                </div>
            </div>

            <!-- Dynamic Countdown & Controls -->
            <div style="background: #FFF9FA; border: 1px solid #FFE6EE; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px;">
                    <span id="countdown-text" style="color: var(--primary-pink); font-weight: bold;">
                        ⏳ 剩餘 30 秒自動切換下一個 (1/1)
                    </span>
                    <div style="display: flex; gap: 6px;">
                        <button id="pause-btn" style="background: none; border: 1px solid #FFCCD9; border-radius: 6px; padding: 2px 8px; font-size: 10px; color: var(--primary-pink); font-weight: bold; cursor: pointer;">
                            ⏸ 暫停
                        </button>
                        <button id="skip-btn" style="background: #FFF0F4; border: 1px solid #FFCCD9; border-radius: 6px; padding: 2px 8px; font-size: 10px; color: var(--primary-pink); font-weight: bold; cursor: pointer;">
                            ⏭ 跳過
                        </button>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div style="width: 100%; height: 6px; background: #FFE6EE; border-radius: 10px; overflow: hidden;">
                    <div id="countdown-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #FF799C, #FFA2BD); border-radius: 10px; transition: width 0.3s ease;"></div>
                </div>

                <div style="display: flex; justify-content: space-between; font-size: 10px; color: #999;">
                    <span>💡 官方播放器內建最高 2x，可於右下角選取</span>
                    <span style="color: var(--primary-pink); font-weight: 500;">🔁 列表自動無限循環</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="font-size: 12px; font-weight: bold; color: #FF799C; margin-bottom: 8px;" id="current-title">正在载入...</div>
            <div class="player-wrapper">
                <iframe id="video-frame" src="" allowfullscreen="true"></iframe>
            </div>

            <!-- Real-time Stats Panel -->
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-name">👀 在線人數</span>
                    <span class="stat-val pink" id="stat-online">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">▶ 實時播放</span>
                    <span class="stat-val" id="stat-view">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">👍 點贊數</span>
                    <span class="stat-val" id="stat-like">--</span>
                </div>
            </div>

            <a id="bili-link" class="open-link" style="margin-top: 10px;" href="#" target="_blank" rel="noopener noreferrer">
                🚀 打开 B 站主站观赏 / 投币点赞
            </a>
        </div>

        <div class="card">
            <div class="playlist-header">
                <span>播放列表 (<span id="count">0</span>)</span>
                <span style="font-size: 11px; color: #999;">点击切换</span>
            </div>
            <div class="playlist-list" id="playlist-box"></div>
        </div>
    </div>

    <script>
        let videos = ["BV1pbbj6bEXB"];
        let activeIndex = 0;
        let autoSwitch = true;
        let duration = 30;
        let countdown = 30;
        let isPaused = false;
        let speed = 2.0;

        const elInput = document.getElementById('bv-input');
        const elLoad = document.getElementById('load-btn');
        const elFrame = document.getElementById('video-frame');
        const elTitle = document.getElementById('current-title');
        const elBiliLink = document.getElementById('bili-link');
        const elBox = document.getElementById('playlist-box');
        const elCount = document.getElementById('count');
        const elToggleAuto = document.getElementById('toggle-auto-btn');
        const elCountdown = document.getElementById('countdown-text');
        const elBar = document.getElementById('countdown-bar');
        const elPauseBtn = document.getElementById('pause-btn');
        const elSkipBtn = document.getElementById('skip-btn');

        elInput.value = videos.join('\n');

        function updateCountdownUI() {
            if (!elCountdown || !elBar) return;
            const currentTotal = videos.length || 1;
            if (!autoSwitch) {
                elCountdown.innerText = '⏸️ 自動輪播已停用';
                elBar.style.width = '0%';
                if (elToggleAuto) {
                    elToggleAuto.innerText = '○ 已關閉輪播';
                    elToggleAuto.style.background = '#F3F4F6';
                    elToggleAuto.style.color = '#6B7280';
                    elToggleAuto.style.borderColor = '#E5E7EB';
                }
                return;
            }

            if (elToggleAuto) {
                elToggleAuto.innerText = '● 自動輪播中';
                elToggleAuto.style.background = '#ECFDF5';
                elToggleAuto.style.color = '#059669';
                elToggleAuto.style.borderColor = '#A7F3D0';
            }

            if (isPaused) {
                elCountdown.innerText = '⏸️ 已暫停倒數 · 剩餘 ' + countdown + ' 秒 (' + (activeIndex + 1) + '/' + currentTotal + ')';
                if (elPauseBtn) elPauseBtn.innerText = '▶ 繼續';
            } else {
                elCountdown.innerText = '⏳ 剩餘 ' + countdown + ' 秒切換下一個 (' + (activeIndex + 1) + '/' + currentTotal + ')';
                if (elPauseBtn) elPauseBtn.innerText = '⏸ 暫停';
            }

            const percent = Math.min(100, Math.max(0, ((duration - countdown) / duration) * 100));
            elBar.style.width = percent + '%';
        }

        setInterval(function() {
            if (!autoSwitch || isPaused || videos.length <= 1) return;
            countdown--;
            if (countdown <= 0) {
                countdown = duration;
                switchVideo((activeIndex + 1) % videos.length);
            }
            updateCountdownUI();
        }, 1000);

        if (elToggleAuto) {
            elToggleAuto.onclick = function() {
                autoSwitch = !autoSwitch;
                if (autoSwitch) {
                    countdown = duration;
                    isPaused = false;
                }
                updateCountdownUI();
            };
        }

        if (elPauseBtn) {
            elPauseBtn.onclick = function() {
                isPaused = !isPaused;
                updateCountdownUI();
            };
        }

        if (elSkipBtn) {
            elSkipBtn.onclick = function() {
                countdown = duration;
                switchVideo((activeIndex + 1) % (videos.length || 1));
            };
        }

        document.querySelectorAll('.dur-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                duration = parseInt(btn.dataset.sec, 10);
                countdown = duration;
                updateCountdownUI();
            };
        });

        document.querySelectorAll('.spd-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.spd-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                speed = parseFloat(btn.dataset.spd);
            };
        });

        function renderList() {
            elBox.innerHTML = '';
            elCount.innerText = videos.length;
            videos.forEach((bv, idx) => {
                const item = document.createElement('div');
                item.className = 'playlist-item ' + (idx === activeIndex ? 'active' : '');
                item.innerHTML = '<span>' + (idx + 1) + '. ' + bv + '</span><span>' + (idx === activeIndex ? '▶ 正在播放' : '點擊觀看') + '</span>';
                item.onclick = () => switchVideo(idx);
                elBox.appendChild(item);
            });
        }

        function formatNum(n) {
            if (n === undefined || n === null) return '--';
            const num = Number(n);
            if (isNaN(num)) return String(n);
            if (num >= 10000) return (num / 10000).toFixed(1) + ' 萬';
            return num.toLocaleString();
        }

        function fetchLiveStats(bvid) {
            const elOnline = document.getElementById('stat-online');
            const elView = document.getElementById('stat-view');
            const elLike = document.getElementById('stat-like');
            if (!elOnline || !elView || !elLike) return;

            elOnline.innerText = '載入中';
            elView.innerText = '載入中';
            elLike.innerText = '載入中';

            const cbView = 'bili_stat_' + Math.floor(Math.random() * 1000000);
            const script = document.createElement('script');
            window[cbView] = function(res) {
                delete window[cbView];
                if (script.parentNode) script.parentNode.removeChild(script);
                if (res && res.code === 0 && res.data) {
                    const d = res.data;
                    elView.innerText = formatNum(d.stat && d.stat.view);
                    elLike.innerText = formatNum(d.stat && d.stat.like);
                    if (d.title) {
                        elTitle.innerText = '當前播放：' + bvid + ' · ' + d.title.slice(0, 16);
                    }

                    // fetch online count
                    const cid = d.cid;
                    const cbOnline = 'bili_onl_' + Math.floor(Math.random() * 1000000);
                    const sOnline = document.createElement('script');
                    window[cbOnline] = function(oRes) {
                        delete window[cbOnline];
                        if (sOnline.parentNode) sOnline.parentNode.removeChild(sOnline);
                        if (oRes && oRes.code === 0 && oRes.data) {
                            elOnline.innerText = (oRes.data.total || oRes.data.count || '1+') + ' 人';
                        } else {
                            elOnline.innerText = '1+ 人';
                        }
                    };
                    sOnline.onerror = function() {
                        delete window[cbOnline];
                        if (sOnline.parentNode) sOnline.parentNode.removeChild(sOnline);
                        elOnline.innerText = '--';
                    };
                    sOnline.src = 'https://api.bilibili.com/x/player/online/total?bvid=' + bvid + (cid ? '&cid=' + cid : '') + '&jsonp=jsonp&callback=' + cbOnline;
                    document.body.appendChild(sOnline);
                } else {
                    elView.innerText = '--';
                    elLike.innerText = '--';
                    elOnline.innerText = '--';
                }
            };
            script.onerror = function() {
                delete window[cbView];
                if (script.parentNode) script.parentNode.removeChild(script);
                elView.innerText = '--';
                elLike.innerText = '--';
                elOnline.innerText = '--';
            };
            script.src = 'https://api.bilibili.com/x/web-interface/view?bvid=' + bvid + '&jsonp=jsonp&callback=' + cbView;
            document.body.appendChild(script);
        }

        function switchVideo(idx) {
            if (!videos[idx]) return;
            activeIndex = idx;
            const bv = videos[idx];
            elFrame.src = 'https://player.bilibili.com/player.html?bvid=' + bv + '&page=1&autoplay=0';
            elTitle.innerText = '当前播放：' + bv;
            elBiliLink.href = 'https://www.bilibili.com/video/' + bv;
            countdown = duration;
            updateCountdownUI();
            fetchLiveStats(bv);
            renderList();
        }

        elLoad.onclick = () => {
            const raw = elInput.value;
            const matches = raw.match(/BV[1-9A-HJ-NP-Za-km-z]{10}/g) || [];
            const unique = [...new Set(matches)];
            if (unique.length === 0) {
                alert('未检测到有效的 BV 号');
                return;
            }
            videos = unique;
            activeIndex = 0;
            switchVideo(0);
        };

        if (videos.length > 0) {
            switchVideo(0);
        }

        setInterval(function() {
            if (videos[activeIndex]) {
                fetchLiveStats(videos[activeIndex]);
            }
        }, 30000);
    </script>
</body>
</html>
